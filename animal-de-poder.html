<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz – Animal de Poder</title>

<style>
    body {
        margin: 0;
        font-family: "Georgia", serif;
        background: #000 url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1600&q=80") 
                    no-repeat center top;
        background-size: cover;
        color: #f8f8f8;
        text-shadow: 0 0 8px rgba(0,0,0,0.8);
    }

    .overlay {
        background: rgba(0,0,0,0.7);
        min-height: 100vh;
        padding: 20px;
    }

    header {
        text-align: center;
        padding: 20px 0;
        font-size: 28px;
        font-weight: bold;
        letter-spacing: 2px;
        color: #fff;
    }

    .container {
        max-width: 750px;
        margin: auto;
        background: rgba(0,0,0,0.65);
        padding: 25px;
        border-radius: 12px;
        border: 2px solid #444;
        box-shadow: 0 0 20px #111;
    }

    h2 {
        margin-bottom: 20px;
        color: #ffd27f;
        text-align: center;
    }

    .pergunta {
        font-size: 22px;
        margin-bottom: 20px;
        color: #ffe9c4;
        text-align: center;
    }

    button {
        width: 100%;
        padding: 15px;
        margin: 10px 0;
        font-size: 16px;
        border: none;
        border-radius: 8px;
        background: linear-gradient(90deg, #5c2d12, #8a4b23);
        color: #fff;
        cursor: pointer;
        transition: 0.2s;
        box-shadow: 0 0 8px rgba(255,185,85,0.3);
    }

    button:hover {
        background: linear-gradient(90deg, #8a4b23, #b66a32);
        transform: scale(1.03);
    }

    /* Adsterra container */
    .adbox {
        margin: 15px 0;
        background: rgba(255,255,255,0.08);
        padding: 10px;
        border-radius: 8px;
        text-align: center;
    }
</style>
</head>
<body>

<div class="overlay">

<header>Descubra Seu Animal de Poder</header>

<div class="container">

    <div class="adbox">
        <!-- Adsterra Native Banner -->
        <script async data-cfasync="false" src="https://pl28845410.effectivegatecpm.com/3c2eb1000098aa584074fbf52f463bc0/invoke.js"></script>
        <div id="container-3c2eb1000098aa584074fbf52f463bc0"></div>
    </div>

    <h2 id="topoFrase">Os animais de poder chamam você quando sua alma está pronta…</h2>

    <div id="quiz"></div>

</div>

</div>

<script>
// Frases místicas
const frasesTopo = [
    "Os animais de poder chamam você quando sua alma está pronta…",
    "Se você chegou até aqui, seu guia espiritual deseja se revelar.",
    "O espírito ancestral se aproxima quando sua energia desperta.",
    "A Lua observa, os ventos sussurram — seu animal se aproxima.",
    "Antigos xamãs acreditavam que o guia escolhe você, não o contrário.",
    "Um animal observa sua jornada silenciosamente há muito tempo."
];

// 15 perguntas
const perguntas = [
    {
        pergunta: "1. O que você mais busca neste momento?",
        respostas: [
            { txt: "Clareza e visão ampliada", animal: "aguia" },
            { txt: "Intuição e proteção interior", animal: "lobo" },
            { txt: "Silêncio e força interna", animal: "urso" },
            { txt: "Poder e coragem instintiva", animal: "onca" },
            { txt: "Transformação e cura profunda", animal: "serpente" },
            { txt: "Leveza e alegria da alma", animal: "beija" },
            { txt: "Renovação e mudança", animal: "borboleta" },
            { txt: "Sabedoria e mistério", animal: "coruja" },
            { txt: "Liberdade e energia vital", animal: "cavalo" },
            { txt: "Sensibilidade e conexão ancestral", animal: "baleia" }
        ]
    }
];

// Repete variações para gerar 15 perguntas
while (perguntas.length < 15) {
    const n = perguntas.length + 1;
    perguntas.push({
        pergunta: `${n}. Qual energia mais ressoa com seu momento atual?`,
        respostas: perguntas[0].respostas
    });
}

// Controle
let i = 0;
let pontos = {
    aguia:0, lobo:0, urso:0, onca:0, serpente:0,
    beija:0, borboleta:0, coruja:0, cavalo:0, baleia:0
};

function render() {
    document.getElementById("topoFrase").innerText =
        frasesTopo[Math.floor(Math.random()*frasesTopo.length)];

    const q = perguntas[i];
    let html = `<div class='pergunta'>${q.pergunta}</div>`;

    q.respostas.forEach(r => {
        html += `<button onclick="responder('${r.animal}')">${r.txt}</button>`;
    });

    document.getElementById("quiz").innerHTML = html;
}

function responder(animal) {
    pontos[animal]++;
    i++;
    if (i >= perguntas.length) finalizar();
    else render();
}

function finalizar() {
    const animal = Object.keys(pontos).reduce((a,b) =>
        pontos[a] > pontos[b] ? a : b
    );
    window.location.href = "resultado.html?animal=" + animal;
}

render();
</script>

</body>
</html>
