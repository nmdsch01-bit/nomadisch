let perguntaAtual = 0;
let contagem = {};

function iniciarQuiz() {
    animais.forEach(a => contagem[a] = 0);
    perguntaAtual = 0;
    mostrarPergunta();
    document.getElementById("start-btn").style.display = "none";
}

function mostrarPergunta() {
    document.getElementById("mensagem-topo").innerText =
        mensagens[Math.floor(Math.random() * mensagens.length)];

    const div = document.getElementById("quiz-box");
    div.innerHTML = `
        <h2>${perguntas[perguntaAtual]}</h2>
    `;

    animais.forEach(animal => {
        const texto = respostas[animal][perguntaAtual];
        div.innerHTML += `
            <button class="resposta" onclick="responder('${animal}')">${texto}</button>
        `;
    });
}

function responder(animal) {
    contagem[animal]++;

    perguntaAtual++;

    if (perguntaAtual >= perguntas.length) {
        finalizarQuiz();
    } else {
        mostrarPergunta();
    }
}

function finalizarQuiz() {
    let vencedor = null;
    let maior = -1;

    for (let animal in contagem) {
        if (contagem[animal] > maior) {
            maior = contagem[animal];
            vencedor = animal;
        }
    }

    window.location.href = `resultado.html?animal=${encodeURIComponent(vencedor)}`;
}
