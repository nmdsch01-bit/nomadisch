<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Qual é seu Animal de Poder?</title>

<style>

body{
font-family:Arial;
background:#f4f4f4;
text-align:center;
margin:0;
}

.container{
max-width:700px;
margin:auto;
background:white;
padding:20px;
}

h1{
color:#333;
}

.question{
font-size:22px;
margin-bottom:20px;
}

.option{
background:#f1f1f1;
padding:15px;
margin:10px;
border-radius:8px;
cursor:pointer;
transition:0.3s;
}

.option:hover{
background:#ddd;
}

/* ADS */

.ad-left{
position:fixed;
left:0;
top:100px;
width:160px;
}

.ad-right{
position:fixed;
right:0;
top:100px;
width:160px;
}

@media(max-width:900px){
.ad-left,.ad-right{
display:none;
}
}

</style>
</head>

<body>

<!-- ADS LATERAIS -->
<div class="ad-left">
COLE SCRIPT ADSTERRA
</div>

<div class="ad-right">
COLE SCRIPT ADSTERRA
</div>

<div class="container">

<h1>🐺 Descubra seu Animal de Poder</h1>

<div id="quiz">

<div class="question" id="question"></div>

<div id="options"></div>

</div>

</div>

<script>

const quiz = [

{
question:"Qual ambiente você prefere?",
options:[
{text:"Floresta",animal:"lobo"},
{text:"Montanhas",animal:"aguia"},
{text:"Caverna",animal:"urso"},
{text:"Selva",animal:"tigre"},
{text:"Noite silenciosa",animal:"coruja"}
]
},

{
question:"Qual qualidade te define?",
options:[
{text:"Lealdade",animal:"lobo"},
{text:"Liberdade",animal:"aguia"},
{text:"Força",animal:"urso"},
{text:"Coragem",animal:"tigre"},
{text:"Sabedoria",animal:"coruja"}
]
},

{
question:"Como você enfrenta problemas?",
options:[
{text:"Em equipe",animal:"lobo"},
{text:"Com visão estratégica",animal:"aguia"},
{text:"Com resistência",animal:"urso"},
{text:"Atacando rápido",animal:"tigre"},
{text:"Observando primeiro",animal:"coruja"}
]
},

{
question:"O que te atrai mais?",
options:[
{text:"Amizades fortes",animal:"lobo"},
{text:"Explorar o mundo",animal:"aguia"},
{text:"Proteção da família",animal:"urso"},
{text:"Aventura",animal:"tigre"},
{text:"Conhecimento",animal:"coruja"}
]
},

{
question:"Qual energia combina com você?",
options:[
{text:"Instinto",animal:"lobo"},
{text:"Altura e visão",animal:"aguia"},
{text:"Poder interior",animal:"urso"},
{text:"Intensidade",animal:"tigre"},
{text:"Mistério",animal:"coruja"}
]
}

]

let current = 0

let score = {
lobo:0,
aguia:0,
urso:0,
tigre:0,
coruja:0
}

function loadQuestion(){

const q = quiz[current]

document.getElementById("question").innerText = q.question

const optionsDiv = document.getElementById("options")

optionsDiv.innerHTML=""

q.options.forEach(option=>{

const btn = document.createElement("div")

btn.className="option"

btn.innerText = option.text

btn.onclick = ()=>{

score[option.animal]++

nextQuestion()

}

optionsDiv.appendChild(btn)

})

}

function nextQuestion(){

current++

if(current < quiz.length){

loadQuestion()

}else{

localStorage.setItem("quizResult",JSON.stringify(score))

window.location="resultado.html"

}

}

loadQuestion()

</script>

</body>
</html>
