<script>

let animals = {
aguia:0,
lobo:0,
urso:0,
pantera:0,
serpente:0,
coruja:0,
cavalo:0,
tigre:0,
falcao:0,
golfinho:0
}

const quiz=[

{
q:"O que você mais busca na vida?",
a:[
["ter visão clara do futuro","aguia"],
["seguir meu instinto","lobo"],
["força interior","urso"],
["poder pessoal","pantera"],
["transformação","serpente"]
]
},

{
q:"Como você reage a desafios?",
a:[
["analiso tudo primeiro","coruja"],
["confio no instinto","lobo"],
["enfrento com coragem","tigre"],
["me adapto rápido","serpente"],
["uso inteligência","falcao"]
]
},

{
q:"Qual ambiente te atrai?",
a:[
["montanhas e céu","aguia"],
["florestas profundas","urso"],
["noite e mistério","pantera"],
["rios e mar","golfinho"],
["planícies abertas","cavalo"]
]
},

{
q:"Como amigos te descrevem?",
a:[
["sábio","coruja"],
["leal","lobo"],
["forte","urso"],
["intenso","tigre"],
["livre","cavalo"]
]
},

{
q:"Quando precisa decidir rápido:",
a:[
["uso visão estratégica","aguia"],
["sigo instinto","lobo"],
["mantenho firmeza","urso"],
["ajo com poder","pantera"],
["mudo estratégia","serpente"]
]
},

{
q:"Sua maior qualidade:",
a:[
["clareza mental","aguia"],
["intuição","lobo"],
["resistência","urso"],
["liderança","tigre"],
["liberdade","cavalo"]
]
},

{
q:"Em um grupo você é:",
a:[
["observador","coruja"],
["protetor","lobo"],
["pilar forte","urso"],
["dominante","tigre"],
["independente","pantera"]
]
},

{
q:"O que mais te move?",
a:[
["conhecimento","coruja"],
["família","lobo"],
["superação","urso"],
["poder","pantera"],
["evolução","serpente"]
]
},

{
q:"Se estivesse na natureza:",
a:[
["voando alto","aguia"],
["correndo livre","cavalo"],
["nadando profundo","golfinho"],
["espreitando na selva","tigre"],
["observando em silêncio","coruja"]
]
},

{
q:"Seu tipo de energia:",
a:[
["mental","coruja"],
["instintiva","lobo"],
["física","urso"],
["intensa","pantera"],
["fluida","serpente"]
]
},

{
q:"O que mais valoriza?",
a:[
["sabedoria","coruja"],
["lealdade","lobo"],
["força","urso"],
["coragem","tigre"],
["liberdade","cavalo"]
]
},

{
q:"Qual palavra define sua alma?",
a:[
["visão","aguia"],
["instinto","lobo"],
["força","urso"],
["poder","pantera"],
["transformação","serpente"]
]
}

]

let current=0

function loadQuestion(){

let q=quiz[current]

document.getElementById("question").innerText="Pergunta "+(current+1)+" de "+quiz.length+" — "+q.q

let optionsHTML=""

q.a.forEach(opt=>{
optionsHTML+=`<div class="option" onclick="answer('${opt[1]}')">${opt[0]}</div>`
})

document.getElementById("options").innerHTML=optionsHTML

let progress=(current/quiz.length)*100

document.getElementById("progress").style.width=progress+"%"

}

function answer(animal){

animals[animal]++

current++

if(current<quiz.length){

loadQuestion()

}else{

let winner=Object.keys(animals).reduce((a,b)=>animals[a]>animals[b]?a:b)

localStorage.setItem("animalResultado",winner)

window.location="resultado.html"

}

}

loadQuestion()

</script>
