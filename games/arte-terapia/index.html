<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mandala Zen | Nomadisch Play</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #8b5cf6;
      --secondary: #06b6d4;
      --accent: #f472b6;
      --dark: #0f172a;
      --glass: rgba(30, 41, 59, 0.8);
      --glass-border: rgba(255, 255, 255, 0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: white;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Header minimalista */
    header {
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--glass);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.2rem;
      background: rgba(255,255,255,0.1);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      color: white;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.3s;
    }

    .back-btn:hover {
      background: var(--primary);
      transform: translateX(-3px);
    }

    .game-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
    }

    /* Canvas do jogo */
    .game-container {
      max-width: 900px;
      margin: 2rem auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .mandala-canvas {
      background: var(--glass);
      border: 2px solid var(--glass-border);
      border-radius: 20px;
      padding: 1rem;
      box-shadow: 0 20px 60px rgba(139, 92, 246, 0.2);
    }

    canvas {
      border-radius: 16px;
      cursor: crosshair;
      max-width: 100%;
      height: auto;
      display: block;
    }

    /* Controles */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      align-items: center;
      background: var(--glass);
      padding: 1rem 1.5rem;
      border-radius: 16px;
      border: 1px solid var(--glass-border);
      max-width: 100%;
    }

    .color-picker {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .color-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 3px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
      padding: 0;
    }

    .color-btn:hover, .color-btn.active {
      border-color: white;
      transform: scale(1.15);
    }

    .brush-size {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--gray);
      font-size: 0.9rem;
    }

    .brush-size input {
      width: 100px;
      accent-color: var(--primary);
    }

    .action-btn {
      padding: 0.7rem 1.4rem;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border: none;
      border-radius: 12px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(139, 92, 246, 0.4);
    }

    .action-btn.secondary {
      background: rgba(255,255,255,0.1);
      border: 1px solid var(--glass-border);
    }

    /* Instruções */
    .instructions {
      text-align: center;
      color: var(--gray);
      font-size: 0.95rem;
      max-width: 600px;
      line-height: 1.6;
    }

    .instructions strong {
      color: var(--secondary);
    }

    /* Responsive */
    @media (max-width: 768px) {
      header {
        padding: 0.8rem 1rem;
        flex-wrap: wrap;
        gap: 0.8rem;
      }

      .controls {
        flex-direction: column;
        padding: 1rem;
      }

      .brush-size {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <header>
    <a href="../../index.html" class="back-btn">
      <i class="fas fa-arrow-left"></i>
      Voltar ao Hub
    </a>
    <h1 class="game-title">🎨 Mandala Zen</h1>
    <button class="action-btn secondary" id="saveBtn">
      <i class="fas fa-download"></i> Salvar
    </button>
  </header>

  <main class="game-container">
    <div class="mandala-canvas">
      <canvas id="mandala" width="500" height="500"></canvas>
    </div>

    <div class="controls">
      <div class="color-picker">
        <button class="color-btn active" style="background: #ffffff" data-color="#ffffff"></button>
        <button class="color-btn" style="background: #f472b6" data-color="#f472b6"></button>
        <button class="color-btn" style="background: #8b5cf6" data-color="#8b5cf6"></button>
        <button class="color-btn" style="background: #06b6d4" data-color="#06b6d4"></button>
        <button class="color-btn" style="background: #10b981" data-color="#10b981"></button>
        <button class="color-btn" style="background: #f59e0b" data-color="#f59e0b"></button>
        <input type="color" id="customColor" value="#ffffff" style="width: 32px; height: 32px; border: none; border-radius: 50%; cursor: pointer;">
      </div>

      <div class="brush-size">
        <i class="fas fa-paint-brush"></i>
        <input type="range" id="brushSize" min="2" max="30" value="8">
        <span id="sizeValue">8px</span>
      </div>

      <button class="action-btn secondary" id="undoBtn">
        <i class="fas fa-undo"></i> Desfazer
      </button>
      <button class="action-btn" id="clearBtn">
        <i class="fas fa-trash"></i> Limpar
      </button>
    </div>

    <p class="instructions">
      <strong>Clique e arraste</strong> para colorir a mandala. 
      Use as cores para expressar suas emoções. 
      Respire fundo e aproveite o momento zen. 🧘✨
    </p>
  </main>

  <script>
    // ========== CONFIGURAÇÃO DO CANVAS ==========
    const canvas = document.getElementById('mandala');
    const ctx = canvas.getContext('2d');
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const radius = Math.min(centerX, centerY) - 30;

    // Estado do jogo
    let currentColor = '#ffffff';
    let brushSize = 8;
    let isDrawing = false;
    let history = [];

    // ========== DESENHAR MANDALA BASE ==========
    function drawMandalaBase() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Fundo suave
      ctx.fillStyle = 'rgba(30, 41, 59, 0.5)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Círculos concêntricos
      ctx.strokeStyle = 'rgba(139, 92, 246, 0.3)';
      ctx.lineWidth = 1;
      
      for (let r = 50; r <= radius; r += 40) {
        ctx.beginPath();
        ctx.arc(centerX, centerY, r, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Linhas radiais (8 divisões)
      for (let i = 0; i < 8; i++) {
        const angle = (i * Math.PI / 4);
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(
          centerX + Math.cos(angle) * radius,
          centerY + Math.sin(angle) * radius
        );
        ctx.stroke();
      }

      // Padrão decorativo central
      ctx.beginPath();
      ctx.arc(centerX, centerY, 25, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(6, 182, 212, 0.5)';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Salvar estado inicial
      saveState();
    }

    // ========== CONTROLES DE DESENHO ==========
    function startDrawing(e) {
      isDrawing = true;
      draw(e);
    }

    function stopDrawing() {
      if (isDrawing) {
        isDrawing = false;
        ctx.beginPath(); // Reset path
        saveState();
      }
    }

    function draw(e) {
      if (!isDrawing) return;

      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX || e.touches?.[0]?.clientX) - rect.left;
      const y = (e.clientY || e.touches?.[0]?.clientY) - rect.top;

      ctx.lineWidth = brushSize;
      ctx.lineCap = 'round';
      ctx.strokeStyle = currentColor;

      ctx.lineTo(x, y);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x, y);
    }

    // ========== HISTÓRICO (UNDO) ==========
    function saveState() {
      history.push(canvas.toDataURL());
      if (history.length > 20) history.shift(); // Limite de memória
    }

    function undo() {
      if (history.length > 1) {
        history.pop();
        const img = new Image();
        img.src = history[history.length - 1];
        img.onload = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0);
        };
      }
    }

    // ========== EVENT LISTENERS ==========
    // Cores
    document.querySelectorAll('.color-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentColor = this.dataset.color;
      });
    });

    document.getElementById('customColor').addEventListener('input', function() {
      currentColor = this.value;
      document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
    });

    // Tamanho do pincel
    const brushInput = document.getElementById('brushSize');
    const sizeValue = document.getElementById('sizeValue');
    
    brushInput.addEventListener('input', function() {
      brushSize = this.value;
      sizeValue.textContent = `${brushSize}px`;
    });

    // Ações
    document.getElementById('clearBtn').addEventListener('click', () => {
      if (confirm('Limpar toda a arte?')) {
        drawMandalaBase();
      }
    });

    document.getElementById('undoBtn').addEventListener('click', undo);

    document.getElementById('saveBtn').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = `mandala-zen-${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    // Mouse e Touch
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseleave', stopDrawing);

    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e); });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); });
    canvas.addEventListener('touchend', stopDrawing);

    // ========== INICIALIZAÇÃO ==========
    drawMandalaBase();

    // Analytics simples (opcional)
    console.log('🎨 Mandala Zen carregado - Sessão iniciada');
  </script>
</body>
</html>
