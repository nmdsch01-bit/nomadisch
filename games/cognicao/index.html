<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Match | Nomadisch Play</title>
  <!-- Mesmos fonts e icons do Mandala -->
  <style>
    /* Reutiliza variáveis CSS do sistema */
    :root {
      --primary: #8b5cf6;
      --secondary: #06b6d4;
      --dark: #0f172a;
      --glass: rgba(30, 41, 59, 0.8);
      --glass-border: rgba(255, 255, 255, 0.1);
      --success: #10b981;
    }
    
    /* ... (estilos similares ao Mandala, adaptados para grid de cards) ... */
    
    .game-board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      max-width: 600px;
      margin: 2rem auto;
      padding: 1rem;
    }

    .card {
      aspect-ratio: 3/4;
      background: var(--glass);
      border: 2px solid var(--glass-border);
      border-radius: 16px;
      cursor: pointer;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.4s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
    }

    .card-front {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      font-size: 1.5rem;
    }

    .card-back {
      background: var(--dark);
      transform: rotateY(180deg);
      color: white;
    }

    .card.matched {
      border-color: var(--success);
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
      cursor: default;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin: 1rem 0;
      font-size: 1.1rem;
    }

    .stat {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* ... restante do CSS ... */
  </style>
</head>
<body>
  <!-- Header igual ao Mandala -->
  
  <main class="game-container">
    <div class="stats">
      <div class="stat">⏱️ <span id="timer">00:00</span></div>
      <div class="stat">🔄 <span id="moves">0</span> movimentos</div>
      <div class="stat">✅ <span id="matches">0</span>/8 pares</div>
    </div>

    <div class="game-board" id="gameBoard"></div>

    <button class="action-btn" id="restartBtn" style="margin: 0 auto;">
      <i class="fas fa-redo"></i> Novo Jogo
    </button>

    <p class="instructions">
      Encontre todos os <strong>8 pares</strong> de símbolos. 
      Treine sua memória e concentração! 🧠✨
    </p>
  </main>

  <script>
    // ========== LÓGICA DO MEMORY MATCH ==========
    const symbols = ['🎨', '🎭', '🎪', '🎨', '🎭', '🎪', '🎨', '🎭']; // 8 pares
    let cards = [];
    let flippedCards = [];
    let matchedPairs = 0;
    let moves = 0;
    let timer = 0;
    let timerInterval;
    let gameStarted = false;

    const gameBoard = document.getElementById('gameBoard');
    const timerEl = document.getElementById('timer');
    const movesEl = document.getElementById('moves');
    const matchesEl = document.getElementById('matches');

    // Embaralhar array (Fisher-Yates)
    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    // Criar cards
    function createCards() {
      const shuffled = shuffle([...symbols]);
      gameBoard.innerHTML = '';
      
      shuffled.forEach((symbol, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.symbol = symbol;
        card.dataset.index = index;
        
        card.innerHTML = `
          <div class="card-face card-front">?</div>
          <div class="card-face card-back">${symbol}</div>
        `;
        
        card.addEventListener('click', flipCard);
        gameBoard.appendChild(card);
        cards.push(card);
      });
    }

    // Virar card
    function flipCard() {
      if (!gameStarted) {
        gameStarted = true;
        startTimer();
      }
      
      if (this.classList.contains('flipped') || 
          this.classList.contains('matched') || 
          flippedCards.length >= 2) return;

      this.classList.add('flipped');
      flippedCards.push(this);

      if (flippedCards.length === 2) {
        moves++;
        movesEl.textContent = moves;
        checkMatch();
      }
    }

    // Verificar match
    function checkMatch() {
      const [card1, card2] = flippedCards;
      
      if (card1.dataset.symbol === card2.dataset.symbol) {
        // Match!
        setTimeout(() => {
          card1.classList.add('matched');
          card2.classList.add('matched');
          matchedPairs++;
          matchesEl.textContent = matchedPairs;
          flippedCards = [];
          
          if (matchedPairs === symbols.length / 2) {
            endGame();
          }
        }, 300);
      } else {
        // No match
        setTimeout(() => {
          card1.classList.remove('flipped');
          card2.classList.remove('flipped');
          flippedCards = [];
        }, 1000);
      }
    }

    // Timer
    function startTimer() {
      timerInterval = setInterval(() => {
        timer++;
        const mins = Math.floor(timer / 60).toString().padStart(2, '0');
        const secs = (timer % 60).toString().padStart(2, '0');
        timerEl.textContent = `${mins}:${secs}`;
      }, 1000);
    }

    // Fim de jogo
    function endGame() {
      clearInterval(timerInterval);
      setTimeout(() => {
        alert(`🎉 Parabéns! Você completou em ${timerEl.textContent} com ${moves} movimentos!`);
      }, 500);
    }

    // Reiniciar
    document.getElementById('restartBtn').addEventListener('click', () => {
      clearInterval(timerInterval);
      cards = [];
      flippedCards = [];
      matchedPairs = 0;
      moves = 0;
      timer = 0;
      gameStarted = false;
      
      timerEl.textContent = '00:00';
      movesEl.textContent = '0';
      matchesEl.textContent = '0';
      
      createCards();
    });

    // Iniciar
    createCards();
  </script>
</body>
</html>
