<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Flow Painter | Nomadisch Play</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #8b5cf6; --secondary: #06b6d4; --accent: #f472b6;
      --dark: #0f172a; --glass: rgba(30, 41, 59, 0.9);
      --glass-border: rgba(255, 255, 255, 0.1);
      --canvas-bg: #1e293b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
    body {
      font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: white; min-height: 100vh; display: flex; flex-direction: column;
    }
    header {
      padding: 0.8rem 1.5rem; display: flex; align-items: center; justify-content: space-between;
      background: var(--glass); backdrop-filter: blur(20px); border-bottom: 1px solid var(--glass-border);
      position: sticky; top: 0; z-index: 100;
    }
    .back-btn {
      display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 1rem;
      background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border);
      border-radius: 12px; color: white; text-decoration: none; font-weight: 500; transition: all 0.3s; font-size: 0.9rem;
    }
    .back-btn:hover { background: var(--primary); transform: translateX(-3px); }
    .game-title { font-family: 'Space Grotesk', sans-serif; font-size: 1.3rem; font-weight: 700; }
    
    /* Controls - Minimal & Calming */
    .controls-bar {
      display: flex; flex-wrap: wrap; gap: 0.8rem; padding: 0.8rem 1rem;
      background: var(--glass); border-bottom: 1px solid var(--glass-border);
      justify-content: center; align-items: center;
    }
    .color-palette { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .color-btn {
      width: 36px; height: 36px; border-radius: 50%; border: 3px solid transparent;
      cursor: pointer; transition: all 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .color-btn:hover, .color-btn.active { border-color: white; transform: scale(1.15); }
    
    .tool-group { display: flex; align-items: center; gap: 0.8rem; color: var(--gray); font-size: 0.9rem; }
    .tool-group input[type="range"] { width: 100px; accent-color: var(--secondary); }
    
    .action-btn {
      padding: 0.6rem 1.2rem; background: linear-gradient(135deg, var(--primary), var(--secondary));
      border: none; border-radius: 12px; color: white; font-weight: 600; cursor: pointer;
      transition: all 0.3s; display: flex; align-items: center; gap: 0.4rem; font-size: 0.9rem;
    }
    .action-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(139, 92, 246, 0.4); }
    .action-btn.secondary { background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); }
    
    /* Canvas */
    #gameContainer {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 1rem; overflow: hidden;
    }
    #flowCanvas {
      background: var(--canvas-bg); border-radius: 20px;
      border: 2px solid var(--glass-border); box-shadow: 0 20px 60px rgba(139, 92, 246, 0.2);
      max-width: 100%; max-height: 70vh; cursor: crosshair; touch-action: none;
    }
    
    /* ADHD-Friendly Instructions */
    .adhd-hint {
      text-align: center; color: var(--gray); font-size: 0.95rem; max-width: 500px;
      margin: 1rem auto; padding: 1rem; background: rgba(16, 185, 129, 0.1);
      border-radius: 16px; border-left: 4px solid var(--success);
      line-height: 1.6;
    }
    .adhd-hint strong { color: var(--success); }
    
    /* Flow effect particles */
    .flow-particle {
      position: absolute; border-radius: 50%; pointer-events: none;
      animation: flowFade 1.5s ease-out forwards;
    }
    @keyframes flowFade {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(2); }
    }
    
    /* Ad Space */
    .game-ad {
      width: 100%; max-width: 728px; margin: 1rem auto; padding: 0.8rem;
      background: var(--glass); border: 1px solid var(--glass-border);
      border-radius: 16px; text-align: center;
    }
    .ad-label { font-size: 0.7rem; color: var(--gray); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; display: block; }
    
    /* Responsive */
    @media (max-width: 600px) {
      .controls-bar { flex-direction: column; align-items: stretch; }
      .color-palette { justify-content: center; }
      .tool-group { justify-content: center; }
    }
  </style>
</head>
<body>
  <header>
    <a href="../../produtos.html" class="back-btn"><i class="fas fa-arrow-left"></i> Hub</a>
    <h1 class="game-title">🎨 Flow Painter</h1>
    <button class="action-btn secondary" id="saveBtn"><i class="fas fa-download"></i> Salvar</button>
  </header>
  
  <div class="controls-bar">
    <div class="color-palette" id="colorPalette"></div>
    <div class="tool-group">
      <i class="fas fa-tint"></i>
      <input type="range" id="flowIntensity" min="1" max="10" value="5">
      <span id="intensityValue">Médio</span>
    </div>
    <button class="action-btn secondary" id="undoBtn"><i class="fas fa-undo"></i> Desfazer</button>
    <button class="action-btn" id="clearBtn"><i class="fas fa-rotate-right"></i> Novo</button>
  </div>
  
  <div id="gameContainer">
    <canvas id="flowCanvas"></canvas>
  </div>
  
  <div class="adhd-hint">
    <strong>🧘 Sem regras, sem pressão:</strong> Deixe a tinta fluir. Não precisa fazer sentido — só sinta o movimento. Cada traço é único, como você. 💜
  </div>
  
  <div class="game-ad">
    <span class="ad-label">Publicidade</span>
    <script async="async" data-cfasync="false" src="https://pl28845410.effectivegatecpm.com/3c2eb1000098aa584074fbf52f463bc0/invoke.js"></script>
    <div id="container-3c2eb1000098aa584074fbf52f463bc0"></div>
  </div>
  
  <script src="https://pl28876220.effectivegatecpm.com/30/b8/d1/30b8d1458b08c08f30d9f4f413e7a20d.js"></script>
  
  <script>
    // Configurações calmantes para TDAH
    const colors = [
      '#6366f1', '#8b5cf6', '#a78bfa', // Roxos suaves
      '#06b6d4', '#22d3ee', '#67e8f9', // Azuis calmantes
      '#10b981', '#34d399', '#6ee7b7', // Verdes relaxantes
      '#f472b6', '#f9a8d4', '#fbcfe8'  // Rosas suaves
    ];
    
    let currentColor = '#6366f1';
    let flowIntensity = 5;
    let isDrawing = false;
    let lastX = 0, lastY = 0;
    let history = [];
    
    const canvas = document.getElementById('flowCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('gameContainer');
    
    // Redimensionar canvas
    function resizeCanvas() {
      const maxWidth = Math.min(800, container.clientWidth - 32);
      const maxHeight = Math.min(500, window.innerHeight - 200);
      canvas.width = maxWidth;
      canvas.height = maxHeight;
      canvas.style.width = maxWidth + 'px';
      canvas.style.height = maxHeight + 'px';
      
      // Fundo suave
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      saveState();
    }
    
    // Criar paleta de cores suaves
    const colorPalette = document.getElementById('colorPalette');
    colors.forEach(color => {
      const btn = document.createElement('button');
      btn.className = 'color-btn' + (color === currentColor ? ' active' : '');
      btn.style.background = color;
      btn.addEventListener('click', () => {
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentColor = color;
      });
      colorPalette.appendChild(btn);
    });
    
    // Controle de intensidade do fluxo
    const intensityInput = document.getElementById('flowIntensity');
    const intensityValue = document.getElementById('intensityValue');
    const intensityLabels = ['Suave', 'Leve', 'Médio', 'Fluido', 'Intenso'];
    
    intensityInput.addEventListener('input', function() {
      flowIntensity = parseInt(this.value);
      intensityValue.textContent = intensityLabels[flowIntensity - 1];
    });
    
    // Efeito de tinta fluindo
    function flowPaint(x, y, prevX, prevY) {
      const dx = x - prevX;
      const dy = y - prevY;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const steps = Math.max(1, Math.floor(dist / 3));
      
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const cx = prevX + dx * t;
        const cy = prevY + dy * t;
        
        // Partícula principal
        ctx.beginPath();
        ctx.arc(cx, cy, 3 + flowIntensity * 0.8, 0, Math.PI * 2);
        ctx.fillStyle = currentColor;
        ctx.fill();
        
        // Efeito de brilho/fluidez
        ctx.beginPath();
        ctx.arc(cx, cy, 8 + flowIntensity * 1.5, 0, Math.PI * 2);
        const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, 8 + flowIntensity * 1.5);
        gradient.addColorStop(0, currentColor + '80');
        gradient.addColorStop(1, currentColor + '00');
        ctx.fillStyle = gradient;
        ctx.fill();
        
        // Partículas secundárias (efeito de respingo suave)
        if (Math.random() > 0.7) {
          const offsetX = (Math.random() - 0.5) * flowIntensity * 2;
          const offsetY = (Math.random() - 0.5) * flowIntensity * 2;
          const size = Math.random() * 2 + 1;
          
          ctx.beginPath();
          ctx.arc(cx + offsetX, cy + offsetY, size, 0, Math.PI * 2);
          ctx.fillStyle = currentColor + '60';
          ctx.fill();
        }
      }
    }
    
    function startDrawing(e) {
      isDrawing = true;
      const rect = canvas.getBoundingClientRect();
      lastX = (e.clientX || e.touches?.[0]?.clientX) - rect.left;
      lastY = (e.clientY || e.touches?.[0]?.clientY) - rect.top;
    }
    
    function draw(e) {
      if (!isDrawing) return;
      e.preventDefault();
      
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX || e.touches?.[0]?.clientX) - rect.left;
      const y = (e.clientY || e.touches?.[0]?.clientY) - rect.top;
      
      flowPaint(x, y, lastX, lastY);
      
      // Efeito visual de partícula flutuante (feedback sensorial)
      createFlowParticle(x, y, currentColor);
      
      lastX = x;
      lastY = y;
    }
    
    function stopDrawing() {
      if (isDrawing) {
        isDrawing = false;
        saveState();
      }
    }
    
    function createFlowParticle(x, y, color) {
      const particle = document.createElement('div');
      particle.className = 'flow-particle';
      particle.style.width = `${6 + flowIntensity}px`;
      particle.style.height = particle.style.width;
      particle.style.background = color;
      particle.style.left = `${x + canvas.offsetLeft - 3}px`;
      particle.style.top = `${y + canvas.offsetTop - 3}px`;
      particle.style.boxShadow = `0 0 10px ${color}`;
      container.appendChild(particle);
      setTimeout(() => particle.remove(), 1500);
    }
    
    function saveState() {
      history.push(canvas.toDataURL());
      if (history.length > 15) history.shift(); // Histórico menor para não sobrecarregar
    }
    
    function undo() {
      if (history.length > 1) {
        history.pop();
        const img = new Image();
        img.src = history[history.length - 1];
        img.onload = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0);
        };
      }
    }
    
    // Event listeners
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseleave', stopDrawing);
    
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e); });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); });
    canvas.addEventListener('touchend', stopDrawing);
    
    document.getElementById('clearBtn').addEventListener('click', () => {
      if (confirm('Começar uma nova arte?')) {
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        saveState();
      }
    });
    
    document.getElementById('undoBtn').addEventListener('click', undo);
    
    document.getElementById('saveBtn').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = `flow-art-${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
    
    // Keyboard shortcut opcional (não obrigatório - ADHD friendly)
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undo(); }
    });
    
    // Inicializar
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
  </script>
  
  <script src="https://pl28876206.effectivegatecpm.com/87/53/16/8753161e227db64bf25c79a6f4a34f05.js"></script>
</body>
</html>
