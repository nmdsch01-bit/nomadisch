<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escolha seu Desastre | Nomadisch Play</title>
  <!-- Mesmos assets -->
  <style>
    /* Estilos futuristas + tema dark humor */
    :root {
      --primary: #8b5cf6;
      --secondary: #06b6d4;
      --danger: #ef4444;
      --dark: #0f172a;
      --glass: rgba(30, 41, 59, 0.85);
    }

    .story-container {
      max-width: 700px;
      margin: 2rem auto;
      padding: 2rem;
      background: var(--glass);
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.1);
      text-align: center;
    }

    .story-text {
      font-size: 1.2rem;
      line-height: 1.8;
      margin: 2rem 0;
      min-height: 120px;
    }

    .choices {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin: 2rem 0;
    }

    .choice-btn {
      padding: 1rem 1.5rem;
      background: linear-gradient(135deg, var(--danger), #7f1d1d);
      border: none;
      border-radius: 12px;
      color: white;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s;
      text-align: left;
    }

    .choice-btn:hover {
      transform: translateX(5px);
      box-shadow: 0 10px 30px rgba(239, 68, 68, 0.4);
    }

    .ending {
      display: none;
    }

    .ending.show {
      display: block;
      animation: fadeIn 0.5s;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .meme-img {
      max-width: 100%;
      border-radius: 12px;
      margin: 1rem 0;
      border: 2px solid var(--danger);
    }
  </style>
</head>
<body>
  <!-- Header padrão -->
  
  <main class="game-container">
    <div class="story-container">
      <h2 style="font-family: 'Space Grotesk'; margin-bottom: 1rem;">😈 Escolha seu Desastre</h2>
      
      <div id="storyContent">
        <p class="story-text" id="storyText">
          Você acorda e percebe que esqueceu de pagar a internet. 
          O que você faz?
        </p>
        
        <div class="choices" id="choices">
          <button class="choice-btn" data-next="a">
            📱 Usa os dados móveis e torce para não estourar o plano
          </button>
          <button class="choice-btn" data-next="b">
            ☕ Sai para tomar café e usar o Wi-Fi do estabelecimento
          </button>
          <button class="choice-btn" data-next="c">
            🧘 Aceita seu destino e medita sobre a efemeridade da conexão
          </button>
        </div>
      </div>

      <div class="ending" id="ending">
        <p class="story-text" id="endingText"></p>
        <img class="meme-img" id="endingMeme" src="" alt="Meme final">
        <button class="action-btn" id="restartBtn" style="margin-top: 2rem;">
          <i class="fas fa-redo"></i> Tentar Outra Escolha
        </button>
      </div>
    </div>

    <p class="instructions">
      Uma aventura interativa onde <strong>toda escolha leva ao caos</strong>. 
      Divirta-se (ou sofra) com as consequências! 😏
    </p>
  </main>

  <script>
    // ========== HISTÓRIAS E FINAIS ==========
    const story = {
      start: {
        text: "Você acorda e percebe que esqueceu de pagar a internet. O que você faz?",
        choices: [
          { text: "📱 Usa os dados móveis e torce para não estourar o plano", next: "data" },
          { text: "☕ Sai para tomar café e usar o Wi-Fi do estabelecimento", next: "cafe" },
          { text: "🧘 Aceita seu destino e medita sobre a efemeridade da conexão", next: "zen" }
        ]
      },
      data: {
        text: "Seus dados acabam em 3 minutos. Agora você está offline no meio de uma discussão importante no grupo da família.",
        choices: [
          { text: "😤 Manda print da tela de 'sem internet' como desculpa", next: "print" },
          { text: "🏃 Corre para o vizinho pedir a senha do Wi-Fi", next: "neighbor" }
        ]
      },
      cafe: {
        text: "O café está lotado. Você consegue um lugar, mas a tomada mais próxima está ocupada por alguém que parece estar em uma reunião de Zoom há 3 horas.",
        choices: [
          { text: "🔌 Espera pacientemente (e sofre)", next: "wait" },
          { text: "🎭 Finge que é influencer e pede a tomada com confiança", next: "influencer" }
        ]
      },
      zen: {
        text: "Enquanto medita, você atinge um novo nível de iluminação... e percebe que poderia ter pago a conta ontem.",
        ending: "🧘‍♂️ Final: Iluminado, mas offline. Pelo menos seu chakra do Wi-Fi está alinhado.",
        meme: "https://via.placeholder.com/400x300/1e293b/94a3b8?text=Zen+Mas+Offline+😌"
      },
      // ... mais ramificações ...
      print: {
        ending: "📱 Final: Sua mãe responde 'Mas você tem 4G, né?' e você chora em silêncio.",
        meme: "https://via.placeholder.com/400x300/1e293b/f87171?text=Mãe+Sempre+Sabe+😭"
      },
      neighbor: {
        ending: "🚪 Final: O vizinho é um hacker e agora você deve um favor... para sempre.",
        meme: "https://via.placeholder.com/400x300/1e293b/fbbf24?text=Hacker+Neighbor+🔐"
      },
      wait: {
        ending: "⏳ Final: Após 47 minutos, a pessoa vai embora. Você carrega 3% e a bateria morre. Poético.",
        meme: "https://via.placeholder.com/400x300/1e293b/94a3b8?text=Bateria+Morta+🔋💀"
      },
      influencer: {
        ending: "✨ Final: Funcionou! Você ganha 2 seguidores e a senha do Wi-Fi. Vitória pírrica.",
        meme: "https://via.placeholder.com/400x300/1e293b/a78bfa?text=Influencer+Por+Um+Dia+📸"
      }
    };

    // ========== LÓGICA DO JOGO ==========
    const storyText = document.getElementById('storyText');
    const choicesEl = document.getElementById('choices');
    const storyContent = document.getElementById('storyContent');
    const ending = document.getElementById('ending');
    const endingText = document.getElementById('endingText');
    const endingMeme = document.getElementById('endingMeme');

    function showNode(nodeKey) {
      const node = story[nodeKey];
      
      if (node.ending) {
        // Final
        storyContent.style.display = 'none';
        ending.classList.add('show');
        endingText.textContent = node.ending;
        endingMeme.src = node.meme;
        endingMeme.alt = "Meme do final";
      } else {
        // Continuação
        storyText.textContent = node.text;
        choicesEl.innerHTML = '';
        
        node.choices.forEach(choice => {
          const btn = document.createElement('button');
          btn.className = 'choice-btn';
          btn.textContent = choice.text;
          btn.dataset.next = choice.next;
          btn.addEventListener('click', () => showNode(choice.next));
          choicesEl.appendChild(btn);
        });
      }
    }

    // Reiniciar
    document.getElementById('restartBtn').addEventListener('click', () => {
      storyContent.style.display = 'block';
      ending.classList.remove('show');
      showNode('start');
    });

    // Iniciar
    showNode('start');
  </script>
</body>
</html>
