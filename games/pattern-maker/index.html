<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Pattern Maker | Nomadisch Play</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #8b5cf6; --secondary: #06b6d4; --accent: #f472b6;
      --dark: #0f172a; --glass: rgba(30, 41, 59, 0.9);
      --glass-border: rgba(255, 255, 255, 0.1);
      --pattern-bg: #1e293b; --gray: #94a3b8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: white; min-height: 100vh; display: flex; flex-direction: column;
    }
    header {
      padding: 0.8rem 1.5rem; display: flex; align-items: center; justify-content: space-between;
      background: var(--glass); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border); position: sticky; top: 0; z-index: 100;
    }
    .back-btn, .save-btn, .shape-btn, .color-btn, .pattern-type-btn, .action-btn {
      cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
    }
    .back-btn {
      display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 1rem;
      background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border);
      border-radius: 12px; color: white; text-decoration: none; font-weight: 500;
      font-size: 0.9rem; transition: all 0.3s;
    }
    .back-btn:hover { background: var(--primary); transform: translateX(-3px); }
    .game-title { font-family: 'Space Grotesk', sans-serif; font-size: 1.3rem; font-weight: 700; }
    .save-btn {
      padding: 0.6rem 1.2rem; background: linear-gradient(135deg, #10b981, #059669);
      border: none; border-radius: 12px; color: white; font-weight: 600; font-size: 0.9rem;
      display: flex; align-items: center; gap: 0.4rem;
    }
    .controls-bar {
      display: flex; flex-wrap: wrap; gap: 0.8rem; padding: 0.8rem 1rem;
      background: var(--glass); border-bottom: 1px solid var(--glass-border);
      justify-content: center; align-items: center; position: sticky; top: 60px; z-index: 90;
    }
    .shape-selector { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; }
    .shape-btn {
      width: 45px; height: 45px; border-radius: 12px; background: rgba(255,255,255,0.1);
      border: 2px solid var(--glass-border); color: white; font-size: 1.3rem;
      display: flex; align-items: center; justify-content: center; transition: all 0.2s;
    }
    .shape-btn:hover, .shape-btn.active {
      border-color: var(--secondary); background: rgba(6, 182, 212, 0.2); transform: scale(1.1);
    }
    .color-palette { display: flex; gap: 0.4rem; flex-wrap: wrap; justify-content: center; }
    .color-btn {
      width: 32px; height: 32px; border-radius: 50%; border: 3px solid transparent;
      transition: all 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .color-btn:hover, .color-btn.active {
      border-color: white; transform: scale(1.15); box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .tool-group { display: flex; align-items: center; gap: 0.8rem; color: var(--gray); font-size: 0.9rem; }
    .tool-group select {
      padding: 0.4rem 0.8rem; border-radius: 8px; background: rgba(255,255,255,0.1);
      color: white; border: none; cursor: pointer;
    }
    .action-buttons { display: flex; gap: 0.6rem; flex-wrap: wrap; justify-content: center; }
    .action-btn {
      padding: 0.6rem 1.2rem; background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border);
      border-radius: 12px; color: white; font-weight: 600; font-size: 0.85rem;
      display: flex; align-items: center; gap: 0.4rem; transition: all 0.3s;
    }
    .action-btn:hover { background: var(--primary); border-color: var(--primary); transform: translateY(-2px); }
    #gameContainer {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 1rem; position: relative;
    }
    .pattern-wrapper {
      background: var(--pattern-bg); border-radius: 20px; padding: 1.5rem;
      border: 2px solid var(--glass-border); box-shadow: 0 20px 60px rgba(139, 92, 246, 0.2);
      display: grid; gap: 8px; max-width: 100%; max-height: 60vh; overflow: auto;
    }
    .pattern-cell {
      width: 40px; height: 40px; border-radius: 8px; background: rgba(255,255,255,0.05);
      border: 1px solid var(--glass-border); display: flex; align-items: center;
      justify-content: center; transition: all 0.2s; font-size: 1.2rem;
      cursor: pointer; user-select: none;
    }
    .pattern-cell:hover { border-color: var(--secondary); transform: scale(1.05); }
    .pattern-cell.filled { animation: popIn 0.3s ease; }
    @keyframes popIn { 0% { transform: scale(0.8); opacity: 0.5; } 100% { transform: scale(1); opacity: 1; } }
    .symmetry-preview {
      margin: 1rem 0; padding: 1rem; background: rgba(255,255,255,0.03);
      border-radius: 12px; border: 1px solid var(--glass-border); text-align: center;
    }
    .symmetry-preview canvas { max-width: 200px; border-radius: 12px; border: 1px solid var(--glass-border); }
    .adhd-hint {
      text-align: center; color: var(--gray); font-size: 0.95rem; max-width: 500px;
      margin: 1rem auto; padding: 1rem; background: rgba(139, 92, 246, 0.1);
      border-radius: 16px; border-left: 4px solid var(--primary); line-height: 1.6;
    }
    .adhd-hint strong { color: var(--primary); }
    .pattern-types {
      display: flex; gap: 0.5rem; margin: 0.5rem 0; flex-wrap: wrap; justify-content: center;
    }
    .pattern-type-btn {
      padding: 0.4rem 1rem; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
      border-radius: 20px; color: var(--gray); font-size: 0.85rem; cursor: pointer; transition: all 0.2s;
    }
    .pattern-type-btn:hover, .pattern-type-btn.active {
      background: var(--accent); color: white; border-color: var(--accent);
    }
    .game-ad {
      width: 100%; max-width: 600px; margin: 1rem auto; padding: 1rem;
      background: var(--glass); border: 1px solid var(--glass-border);
      border-radius: 16px; text-align: center; position: relative; z-index: 1;
    }
    .ad-label { font-size: 0.7rem; color: var(--gray); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; display: block; }
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); z-index: 1000; align-items: center;
      justify-content: center; padding: 1rem; backdrop-filter: blur(10px);
    }
    .modal.show { display: flex; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal-content {
      background: var(--glass); border: 1px solid var(--glass-border); border-radius: 24px;
      padding: 2rem; max-width: 450px; width: 100%; text-align: center; animation: slideUp 0.3s ease;
    }
    @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-content h3 { font-family: 'Space Grotesk', sans-serif; font-size: 1.5rem; margin-bottom: 0.5rem; color: #10b981; }
    .modal-content p { color: var(--gray); margin-bottom: 1.5rem; line-height: 1.6; }
    .modal-preview {
      width: 100%; max-height: 350px; border-radius: 16px; margin-bottom: 1.5rem;
      border: 2px solid var(--glass-border); background: var(--pattern-bg);
      display: flex; align-items: center; justify-content: center;
    }
    .modal-preview canvas { max-width: 100%; max-height: 300px; border-radius: 12px; }
    .modal-buttons { display: flex; gap: 0.8rem; justify-content: center; flex-wrap: wrap; }
    .modal-btn {
      padding: 0.9rem 1.8rem; border-radius: 12px; font-weight: 600; cursor: pointer;
      transition: all 0.3s; border: none; display: flex; align-items: center; gap: 0.5rem; font-size: 0.95rem;
    }
    .modal-btn.primary { background: linear-gradient(135deg, #10b981, #059669); color: white; }
    .modal-btn.primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4); }
    .modal-btn.secondary { background: rgba(255,255,255,0.1); color: white; border: 1px solid var(--glass-border); }
    .modal-btn.secondary:hover { background: rgba(255,255,255,0.2); transform: translateY(-2px); }
    @media (max-width: 600px) {
      header { padding: 0.6rem 1rem; flex-wrap: wrap; gap: 0.6rem; }
      .game-title { font-size: 1.1rem; }
      .controls-bar { padding: 0.6rem 0.8rem; gap: 0.5rem; top: 55px; }
      .shape-btn { width: 40px; height: 40px; font-size: 1.1rem; }
      .color-btn { width: 28px; height: 28px; }
      .action-btn { padding: 0.5rem 0.9rem; font-size: 0.8rem; }
      .pattern-cell { width: 32px; height: 32px; font-size: 1rem; }
      .pattern-wrapper { padding: 1rem; max-height: 50vh; }
      .adhd-hint { font-size: 0.9rem; padding: 0.8rem; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <a href="../../../produtos.html" class="back-btn">
      <i class="fas fa-arrow-left"></i> Hub
    </a>
    <h1 class="game-title">🌀 Pattern Maker</h1>
    <button class="save-btn" id="saveBtn">
      <i class="fas fa-download"></i> Salvar
    </button>
  </header>

  <!-- Controls -->
  <div class="controls-bar">
    <div class="shape-selector" id="shapeSelector">
      <button class="shape-btn active" data-shape="circle">⚪</button>
      <button class="shape-btn" data-shape="square">⬛</button>
      <button class="shape-btn" data-shape="triangle">🔺</button>
      <button class="shape-btn" data-shape="star">⭐</button>
      <button class="shape-btn" data-shape="heart">💜</button>
    </div>
    <div class="color-palette" id="colorPalette"></div>
    <div class="tool-group">
      <i class="fas fa-magic"></i>
      <select id="symmetryMode">
        <option value="none">Sem simetria</option>
        <option value="horizontal">Horizontal ↔️</option>
        <option value="vertical">Vertical ↕️</option>
        <option value="radial" selected>Radial 🌀</option>
      </select>
    </div>
    <div class="action-buttons">
      <button class="action-btn" id="undoBtn">↩️ Desfazer</button>
      <button class="action-btn" id="clearBtn">🔄 Novo</button>
    </div>
  </div>

  <!-- Pattern Size -->
  <div class="pattern-types">
    <button class="pattern-type-btn active" data-size="8">8×8 Calmo</button>
    <button class="pattern-type-btn" data-size="12">12×12 Médio</button>
    <button class="pattern-type-btn" data-size="16">16×16 Detalhado</button>
  </div>

  <!-- Preview -->
  <div class="symmetry-preview">
    <small style="color:var(--gray); display:block; margin-bottom:0.5rem;">Pré-visualização</small>
    <canvas id="previewCanvas" width="200" height="200"></canvas>
  </div>

  <!-- Grid -->
  <div id="gameContainer">
    <div class="pattern-wrapper" id="patternGrid"></div>
  </div>

  <!-- Hint -->
  <div class="adhd-hint">
    <strong>🧘 Ritmo e repetição:</strong> Crie padrões que se repetem. O movimento previsível ajuda a acalmar a mente. Não precisa ser perfeito — só siga o fluxo. 💜
  </div>

  <!-- Ad Space -->
  <div class="game-ad">
    <span class="ad-label">Publicidade</span>
    <script async="async" data-cfasync="false" src=" ... "></script>
    <div id="container-3c2eb1000098aa584074fbf52f463bc0"></div>
  </div>

  <!-- Save Modal -->
  <div class="modal" id="saveModal">
    <div class="modal-content">
      <h3>🌀 Seu Padrão Está Pronto!</h3>
      <p>Que lindo! Sua criação simétrica foi salva.</p>
      <div class="modal-preview">
        <canvas id="modalCanvas" width="400" height="400"></canvas>
      </div>
      <div class="modal-buttons">
        <button class="modal-btn primary" id="downloadPngBtn">⬇️ Baixar PNG</button>
        <button class="modal-btn secondary" id="closeModalBtn">✕ Fechar</button>
      </div>
    </div>
  </div>

  <!-- Social Bar Ad -->
  <script src=" ... "></script>

  <!-- Game Logic -->
  <script>
    // Config
    const colors = ['#6366f1','#8b5cf6','#a78bfa','#06b6d4','#22d3ee','#10b981','#34d399','#f472b6','#f9a8d4'];
    const shapes = { circle: '⚪', square: '⬛', triangle: '🔺', star: '⭐', heart: '💜' };
    
    let currentColor = '#6366f1';
    let currentShape = 'circle';
    let symmetryMode = 'radial';
    let gridSize = 8;
    let pattern = [];
    let history = [];
    
    const patternGrid = document.getElementById('patternGrid');
    const previewCanvas = document.getElementById('previewCanvas');
    const previewCtx = previewCanvas.getContext('2d');
    
    // Cores
    const colorPalette = document.getElementById('colorPalette');
    colors.forEach(color => {
      const btn = document.createElement('button');
      btn.className = 'color-btn' + (color === currentColor ? ' active' : '');
      btn.style.background = color;
      btn.onclick = (e) => {
        e.stopPropagation();
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentColor = color;
      };
      colorPalette.appendChild(btn);
    });
    
    // Formas
    document.querySelectorAll('.shape-btn').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        document.querySelectorAll('.shape-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentShape = btn.dataset.shape;
      };
    });
    
    // Simetria
    document.getElementById('symmetryMode').onchange = (e) => {
      e.stopPropagation();
      symmetryMode = e.target.value;
      updatePreview();
    };
    
    // Tamanho da grade
    document.querySelectorAll('.pattern-type-btn').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        document.querySelectorAll('.pattern-type-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        gridSize = parseInt(btn.dataset.size);
        createGrid();
      };
    });
    
    // Criar grade
    function createGrid() {
      patternGrid.innerHTML = '';
      patternGrid.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
      pattern = Array(gridSize).fill().map(() => Array(gridSize).fill(null));
      
      for (let row = 0; row < gridSize; row++) {
        for (let col = 0; col < gridSize; col++) {
          const cell = document.createElement('div');
          cell.className = 'pattern-cell';
          cell.dataset.row = row;
          cell.dataset.col = col;
          
          cell.onclick = (e) => { e.stopPropagation(); toggleCell(row, col); };
          cell.ontouchstart = (e) => { e.stopPropagation(); e.preventDefault(); toggleCell(row, col); };
          
          patternGrid.appendChild(cell);
        }
      }
      updatePreview();
      saveState();
    }
    
    // Toggle cell
    function toggleCell(row, col) {
      const cells = getSymmetricCells(row, col);
      cells.forEach(({r, c}) => {
        const cell = document.querySelector(`.pattern-cell[data-row="${r}"][data-col="${c}"]`);
        if (pattern[r][c]?.color === currentColor && pattern[r][c]?.shape === currentShape) {
          pattern[r][c] = null;
          cell.innerHTML = '';
          cell.style.background = '';
        } else {
          pattern[r][c] = { color: currentColor, shape: currentShape };
          cell.innerHTML = shapes[currentShape];
          cell.style.color = currentColor;
          cell.style.background = currentColor + '20';
          cell.classList.add('filled');
          setTimeout(() => cell.classList.remove('filled'), 300);
        }
      });
      updatePreview();
      saveState();
    }
    
    // Simetria
    function getSymmetricCells(row, col) {
      const cells = [{row, col}];
      if (symmetryMode === 'horizontal') cells.push({row: gridSize-1-row, col});
      else if (symmetryMode === 'vertical') cells.push({row, col: gridSize-1-col});
      else if (symmetryMode === 'radial') {
        cells.push(
          {row: gridSize-1-row, col},
          {row, col: gridSize-1-col},
          {row: gridSize-1-row, col: gridSize-1-col}
        );
      }
      return [...new Set(cells.map(c => JSON.stringify(c)))].map(c => JSON.parse(c));
    }
    
    // Preview
    function updatePreview() {
      previewCtx.fillStyle = '#1e293b';
      previewCtx.fillRect(0, 0, 200, 200);
      const cellSize = 200 / gridSize;
      for (let row = 0; row < gridSize; row++) {
        for (let col = 0; col < gridSize; col++) {
          const cell = pattern[row][col];
          if (cell) {
            previewCtx.fillStyle = cell.color;
            const x = col * cellSize, y = row * cellSize;
            if (cell.shape === 'circle') {
              previewCtx.beginPath();
              previewCtx.arc(x + cellSize/2, y + cellSize/2, cellSize/2 - 2, 0, Math.PI * 2);
              previewCtx.fill();
            } else if (cell.shape === 'square') {
              previewCtx.fillRect(x + 2, y + 2, cellSize - 4, cellSize - 4);
            } else {
              previewCtx.font = `${cellSize - 4}px Arial`;
              previewCtx.textAlign = 'center';
              previewCtx.textBaseline = 'middle';
              previewCtx.fillText(shapes[cell.shape], x + cellSize/2, y + cellSize/2);
            }
          }
        }
      }
    }
    
    // Histórico
    function saveState() {
      history.push(JSON.stringify(pattern));
      if (history.length > 20) history.shift();
    }
    
    function undo() {
      if (history.length > 1) {
        history.pop();
        pattern = JSON.parse(history[history.length - 1]);
        renderPattern();
        updatePreview();
      }
    }
    
    function renderPattern() {
      for (let row = 0; row < gridSize; row++) {
        for (let col = 0; col < gridSize; col++) {
          const cell = document.querySelector(`.pattern-cell[data-row="${row}"][data-col="${col}"]`);
          const data = pattern[row][col];
          if (data) {
            cell.innerHTML = shapes[data.shape];
            cell.style.color = data.color;
            cell.style.background = data.color + '20';
          } else {
            cell.innerHTML = '';
            cell.style.background = '';
          }
        }
      }
    }
    
    // Ações
    document.getElementById('clearBtn').onclick = (e) => {
      e.stopPropagation();
      if (confirm('Começar um novo padrão?')) createGrid();
    };
    
    document.getElementById('undoBtn').onclick = (e) => {
      e.stopPropagation();
      undo();
    };
    
    // Salvar
    document.getElementById('saveBtn').onclick = (e) => {
      e.stopPropagation();
      saveAsPng();
    };
    
    function saveAsPng() {
      const exportCanvas = document.getElementById('modalCanvas');
      const exportCtx = exportCanvas.getContext('2d');
      exportCtx.fillStyle = '#1e293b';
      exportCtx.fillRect(0, 0, 400, 400);
      const cellSize = 400 / gridSize;
      for (let row = 0; row < gridSize; row++) {
        for (let col = 0; col < gridSize; col++) {
          const cell = pattern[row][col];
          if (cell) {
            exportCtx.fillStyle = cell.color;
            const x = col * cellSize, y = row * cellSize;
            if (cell.shape === 'circle') {
              exportCtx.beginPath();
              exportCtx.arc(x + cellSize/2, y + cellSize/2, cellSize/2 - 3, 0, Math.PI * 2);
              exportCtx.fill();
            } else if (cell.shape === 'square') {
              exportCtx.fillRect(x + 3, y + 3, cellSize - 6, cellSize - 6);
            } else {
              exportCtx.font = `${cellSize - 6}px Arial`;
              exportCtx.textAlign = 'center';
              exportCtx.textBaseline = 'middle';
              exportCtx.fillText(shapes[cell.shape], x + cellSize/2, y + cellSize/2);
            }
          }
        }
      }
      document.getElementById('saveModal').classList.add('show');
      document.getElementById('downloadPngBtn').onclick = () => {
        const link = document.createElement('a');
        link.download = `pattern-${currentShape}-${Date.now()}.png`;
        link.href = exportCanvas.toDataURL('image/png');
        link.click();
      };
    };
    
    document.getElementById('closeModalBtn').onclick = (e) => {
      e.stopPropagation();
      document.getElementById('saveModal').classList.remove('show');
    };
    
    document.getElementById('saveModal').onclick = (e) => {
      if (e.target === document.getElementById('saveModal')) {
        document.getElementById('saveModal').classList.remove('show');
      }
    };
    
    // Keyboard
    document.onkeydown = (e) => {
      if (e.ctrlKey && e.key === 'z') { e.preventDefault(); e.stopPropagation(); undo(); }
      if (e.key === 'Escape') document.getElementById('saveModal').classList.remove('show');
    };
    
    // Init
    window.onload = () => createGrid();
  </script>

  <!-- Popunder Ad -->
  <script src=" ... "></script>
</body>
</html>
