<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Pixel Art Studio | Nomadisch Play</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #8b5cf6; --secondary: #06b6d4; --accent: #f472b6;
      --dark: #0f172a; --glass: rgba(30, 41, 59, 0.9);
      --glass-border: rgba(255, 255, 255, 0.1);
      --pixel-bg: #1e293b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
    body {
      font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: white; min-height: 100vh; display: flex; flex-direction: column;
    }
    header {
      padding: 0.8rem 1.5rem; display: flex; align-items: center; justify-content: space-between;
      background: var(--glass); backdrop-filter: blur(20px); border-bottom: 1px solid var(--glass-border);
      position: sticky; top: 0; z-index: 100;
    }
    .back-btn {
      display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 1rem;
      background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border);
      border-radius: 12px; color: white; text-decoration: none; font-weight: 500; transition: all 0.3s; font-size: 0.9rem;
    }
    .back-btn:hover { background: var(--primary); transform: translateX(-3px); }
    .game-title { font-family: 'Space Grotesk', sans-serif; font-size: 1.3rem; font-weight: 700; }
    
    /* Controls Bar */
    .controls-bar {
      display: flex; flex-wrap: wrap; gap: 0.8rem; padding: 1rem;
      background: var(--glass); border-bottom: 1px solid var(--glass-border);
      justify-content: center; align-items: center;
    }
    .color-palette { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .color-btn {
      width: 32px; height: 32px; border-radius: 6px; border: 2px solid transparent;
      cursor: pointer; transition: all 0.2s;
    }
    .color-btn:hover, .color-btn.active { border-color: white; transform: scale(1.15); }
    
    .tool-group { display: flex; align-items: center; gap: 0.8rem; color: var(--gray); font-size: 0.9rem; }
    .tool-group input[type="range"] { width: 80px; accent-color: var(--primary); }
    
    .action-btn {
      padding: 0.6rem 1.2rem; background: linear-gradient(135deg, var(--primary), var(--secondary));
      border: none; border-radius: 12px; color: white; font-weight: 600; cursor: pointer;
      transition: all 0.3s; display: flex; align-items: center; gap: 0.4rem; font-size: 0.9rem;
    }
    .action-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(139, 92, 246, 0.4); }
    .action-btn.secondary { background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); }
    
    /* Canvas Area */
    #gameContainer {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 1rem; overflow: auto;
    }
    .pixel-canvas-wrapper {
      background: var(--pixel-bg); border-radius: 16px; padding: 1rem;
      border: 2px solid var(--glass-border); box-shadow: 0 20px 60px rgba(139, 92, 246, 0.2);
      overflow: auto; max-width: 100%; max-height: 70vh;
    }
    #pixelCanvas {
      display: grid; gap: 1px; background: #334155; border-radius: 8px;
      image-rendering: pixelated; touch-action: none;
    }
    .pixel {
      width: 20px; height: 20px; background: white; cursor: pointer; transition: background 0.1s;
    }
    @media (max-width: 600px) { .pixel { width: 14px; height: 14px; } }
    
    /* Grid Size Selector */
    .grid-selector {
      display: flex; gap: 0.5rem; margin: 0.5rem 0; flex-wrap: wrap; justify-content: center;
    }
    .grid-btn {
      padding: 0.4rem 1rem; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
      border-radius: 20px; color: var(--gray); font-size: 0.85rem; cursor: pointer; transition: all 0.2s;
    }
    .grid-btn:hover, .grid-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
    
    /* Instructions - ADHD Friendly */
    .adhd-hint {
      text-align: center; color: var(--gray); font-size: 0.9rem; max-width: 500px;
      margin: 1rem auto; padding: 0.8rem 1rem; background: rgba(16, 185, 129, 0.1);
      border-radius: 12px; border-left: 3px solid var(--success);
    }
    .adhd-hint strong { color: var(--success); }
    
    /* Ad Space */
    .game-ad {
      width: 100%; max-width: 728px; margin: 1rem auto; padding: 0.8rem;
      background: var(--glass); border: 1px solid var(--glass-border);
      border-radius: 16px; text-align: center;
    }
    .ad-label { font-size: 0.7rem; color: var(--gray); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; display: block; }
    
    /* Responsive */
    @media (max-width: 500px) {
      .controls-bar { flex-direction: column; align-items: stretch; }
      .color-palette { justify-content: center; }
      .tool-group { justify-content: center; }
    }
  </style>
</head>
<body>
  <header>
    <a href="../../produtos.html" class="back-btn"><i class="fas fa-arrow-left"></i> Hub</a>
    <h1 class="game-title">🎨 Pixel Art Studio</h1>
    <button class="action-btn secondary" id="saveBtn"><i class="fas fa-download"></i> Salvar</button>
  </header>
  
  <div class="controls-bar">
    <div class="color-palette" id="colorPalette"></div>
    <div class="tool-group">
      <i class="fas fa-border-all"></i>
      <select id="gridSize" style="padding:0.4rem 0.8rem; border-radius:8px; background:rgba(255,255,255,0.1); color:white; border:none;">
        <option value="16">16x16</option>
        <option value="24" selected>24x24</option>
        <option value="32">32x32</option>
      </select>
    </div>
    <button class="action-btn secondary" id="undoBtn"><i class="fas fa-undo"></i> Desfazer</button>
    <button class="action-btn" id="clearBtn"><i class="fas fa-trash"></i> Limpar</button>
  </div>
  
  <div class="grid-selector">
    <button class="grid-btn active" data-size="16">Pequeno</button>
    <button class="grid-btn" data-size="24">Médio</button>
    <button class="grid-btn" data-size="32">Grande</button>
  </div>
  
  <div id="gameContainer">
    <div class="pixel-canvas-wrapper">
      <div id="pixelCanvas"></div>
    </div>
  </div>
  
  <div class="adhd-hint">
    <strong>💡 Dica para foco:</strong> Comece com uma cor só. Não precisa ser perfeito — o processo é mais importante que o resultado! 🧘
  </div>
  
  <div class="game-ad">
    <span class="ad-label">Publicidade</span>
    <script async="async" data-cfasync="false" src="https://pl28845410.effectivegatecpm.com/3c2eb1000098aa584074fbf52f463bc0/invoke.js"></script>
    <div id="container-3c2eb1000098aa584074fbf52f463bc0"></div>
  </div>
  
  <script src="https://pl28876220.effectivegatecpm.com/30/b8/d1/30b8d1458b08c08f30d9f4f413e7a20d.js"></script>
  
  <script>
    // Configurações
    const colors = ['#ffffff','#000000','#ef4444','#f97316','#eab308','#22c55e','#06b6d4','#3b82f6','#8b5cf6','#ec4899','#f472b6','#64748b'];
    let currentColor = '#000000';
    let gridSize = 24;
    let history = [];
    let isDrawing = false;
    
    const canvas = document.getElementById('pixelCanvas');
    const colorPalette = document.getElementById('colorPalette');
    
    // Criar paleta de cores
    colors.forEach(color => {
      const btn = document.createElement('button');
      btn.className = 'color-btn' + (color === currentColor ? ' active' : '');
      btn.style.background = color;
      btn.addEventListener('click', () => {
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentColor = color;
      });
      colorPalette.appendChild(btn);
    });
    
    // Criar grade de pixels
    function createGrid(size) {
      canvas.innerHTML = '';
      canvas.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
      
      for (let i = 0; i < size * size; i++) {
        const pixel = document.createElement('div');
        pixel.className = 'pixel';
        pixel.style.background = 'white';
        
        // Eventos de desenho
        pixel.addEventListener('mousedown', () => { isDrawing = true; paint(pixel); });
        pixel.addEventListener('mouseenter', () => { if (isDrawing) paint(pixel); });
        pixel.addEventListener('touchstart', (e) => { e.preventDefault(); isDrawing = true; paint(pixel); });
        pixel.addEventListener('touchmove', (e) => { 
          e.preventDefault(); 
          const touch = e.touches[0];
          const target = document.elementFromPoint(touch.clientX, touch.clientY);
          if (target?.classList.contains('pixel')) paint(target);
        });
        
        canvas.appendChild(pixel);
      }
      
      // Parar de desenhar
      document.addEventListener('mouseup', () => { if (isDrawing) { isDrawing = false; saveState(); } });
      document.addEventListener('touchend', () => { if (isDrawing) { isDrawing = false; saveState(); } });
      
      saveState();
    }
    
    function paint(pixel) {
      if (pixel.style.background !== `rgb(${hexToRgb(currentColor)})` && pixel.style.background !== currentColor) {
        pixel.style.background = currentColor;
      }
    }
    
    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}` : null;
    }
    
    function saveState() {
      const pixels = Array.from(canvas.querySelectorAll('.pixel')).map(p => p.style.background);
      history.push(pixels);
      if (history.length > 20) history.shift();
    }
    
    function undo() {
      if (history.length > 1) {
        history.pop();
        const pixels = history[history.length - 1];
        canvas.querySelectorAll('.pixel').forEach((p, i) => {
          p.style.background = pixels[i];
        });
      }
    }
    
    // Event listeners
    document.getElementById('gridSize').addEventListener('change', (e) => {
      gridSize = parseInt(e.target.value);
      createGrid(gridSize);
    });
    
    document.querySelectorAll('.grid-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.grid-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        gridSize = parseInt(this.dataset.size);
        document.getElementById('gridSize').value = gridSize;
        createGrid(gridSize);
      });
    });
    
    document.getElementById('clearBtn').addEventListener('click', () => {
      if (confirm('Limpar toda a arte?')) {
        canvas.querySelectorAll('.pixel').forEach(p => p.style.background = 'white');
        saveState();
      }
    });
    
    document.getElementById('undoBtn').addEventListener('click', undo);
    
    document.getElementById('saveBtn').addEventListener('click', () => {
      // Criar canvas temporário para exportar
      const tempCanvas = document.createElement('canvas');
      const pixelSize = 20;
      tempCanvas.width = gridSize * pixelSize;
      tempCanvas.height = gridSize * pixelSize;
      const ctx = tempCanvas.getContext('2d');
      
      canvas.querySelectorAll('.pixel').forEach((p, i) => {
        const row = Math.floor(i / gridSize);
        const col = i % gridSize;
        ctx.fillStyle = p.style.background || 'white';
        ctx.fillRect(col * pixelSize, row * pixelSize, pixelSize, pixelSize);
      });
      
      const link = document.createElement('a');
      link.download = `pixel-art-${Date.now()}.png`;
      link.href = tempCanvas.toDataURL('image/png');
      link.click();
    });
    
    // Keyboard shortcuts (ADHD-friendly: optional)
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undo(); }
    });
    
    // Iniciar
    createGrid(gridSize);
  </script>
  
  <script src="https://pl28876206.effectivegatecpm.com/87/53/16/8753161e227db64bf25c79a6f4a34f05.js"></script>
</body>
</html>
