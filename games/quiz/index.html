<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Master | Nomadisch Play</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #8b5cf6; --secondary: #06b6d4; --accent: #f472b6;
      --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
      --dark: #0f172a; --glass: rgba(30, 41, 59, 0.9);
      --glass-border: rgba(255, 255, 255, 0.1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: white; min-height: 100vh; display: flex; flex-direction: column;
    }
    header {
      padding: 0.8rem 1.5rem; display: flex; align-items: center; justify-content: space-between;
      background: var(--glass); backdrop-filter: blur(20px); border-bottom: 1px solid var(--glass-border);
      position: sticky; top: 0; z-index: 100;
    }
    .back-btn {
      display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 1rem;
      background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border);
      border-radius: 12px; color: white; text-decoration: none; font-weight: 500; transition: all 0.3s; font-size: 0.9rem;
    }
    .back-btn:hover { background: var(--primary); transform: translateX(-3px); }
    .game-title { font-family: 'Space Grotesk', sans-serif; font-size: 1.3rem; font-weight: 700; }
    
    /* HUD */
    .hud {
      display: flex; justify-content: center; gap: 2rem; padding: 1rem;
      background: var(--glass); border-bottom: 1px solid var(--glass-border); flex-wrap: wrap;
    }
    .hud-item { display: flex; align-items: center; gap: 0.5rem; font-weight: 600; }
    .hud-item.score { color: var(--secondary); }
    .hud-item.timer { color: var(--warning); }
    .hud-item.streak { color: var(--accent); }
    
    /* Main Content */
    #gameContainer {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 1rem; max-width: 800px; margin: 0 auto; width: 100%;
    }
    
    /* Category Selection */
    .category-select {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1rem; width: 100%; max-width: 600px; margin: 2rem 0;
    }
    .category-btn {
      padding: 1.5rem 1rem; background: var(--glass); border: 2px solid var(--glass-border);
      border-radius: 16px; color: white; font-weight: 600; cursor: pointer;
      transition: all 0.3s; display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
    }
    .category-btn:hover, .category-btn.active {
      border-color: var(--primary); background: rgba(139, 92, 246, 0.2);
      transform: translateY(-3px); box-shadow: 0 10px 30px rgba(139, 92, 246, 0.3);
    }
    .category-btn i { font-size: 2rem; }
    
    /* Question Card */
    .question-card {
      background: var(--glass); border: 1px solid var(--glass-border);
      border-radius: 20px; padding: 2rem; width: 100%; max-width: 600px;
      display: none; animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .question-text {
      font-size: 1.3rem; font-weight: 600; margin-bottom: 1.5rem; line-height: 1.5;
    }
    
    .options { display: flex; flex-direction: column; gap: 0.8rem; }
    .option-btn {
      padding: 1rem 1.5rem; background: rgba(255,255,255,0.05); border: 2px solid var(--glass-border);
      border-radius: 12px; color: white; text-align: left; cursor: pointer;
      transition: all 0.2s; font-size: 1rem; display: flex; align-items: center; gap: 0.8rem;
    }
    .option-btn:hover { background: rgba(255,255,255,0.1); border-color: var(--secondary); }
    .option-btn.correct { background: rgba(16, 185, 129, 0.3); border-color: var(--success); }
    .option-btn.incorrect { background: rgba(239, 68, 68, 0.3); border-color: var(--danger); }
    .option-btn:disabled { cursor: not-allowed; opacity: 0.7; }
    .option-letter {
      width: 28px; height: 28px; border-radius: 50%; background: var(--primary);
      display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.9rem;
    }
    
    /* Feedback */
    .feedback {
      margin-top: 1.5rem; padding: 1rem; border-radius: 12px; display: none;
      font-weight: 500; text-align: center;
    }
    .feedback.correct { background: rgba(16, 185, 129, 0.2); color: var(--success); }
    .feedback.incorrect { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
    
    /* Next Button */
    .next-btn {
      margin-top: 1.5rem; padding: 1rem 2.5rem;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border: none; border-radius: 50px; color: white; font-weight: 700;
      cursor: pointer; transition: all 0.3s; display: none;
    }
    .next-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(139, 92, 246, 0.4); }
    
    /* Screens */
    .screen {
      text-align: center; background: var(--glass); padding: 2rem; border-radius: 20px;
      border: 1px solid var(--glass-border); max-width: 500px; width: 90%;
    }
    .screen h2 { font-family: 'Space Grotesk', sans-serif; font-size: 1.8rem; margin-bottom: 1rem; }
    .screen p { color: var(--gray); margin-bottom: 1.5rem; line-height: 1.6; }
    .action-btn {
      padding: 1rem 2.5rem; background: linear-gradient(135deg, var(--primary), var(--secondary));
      border: none; border-radius: 50px; color: white; font-weight: 700; font-size: 1.1rem;
      cursor: pointer; transition: all 0.3s; display: inline-flex; align-items: center; gap: 0.5rem;
    }
    .action-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(139, 92, 246, 0.5); }
    
    /* Leaderboard */
    .leaderboard {
      background: var(--glass); border: 1px solid var(--glass-border);
      border-radius: 20px; padding: 1.5rem; width: 100%; max-width: 500px; margin-top: 2rem;
    }
    .leaderboard h3 { margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
    .leaderboard-list { list-style: none; }
    .leaderboard-item {
      display: flex; justify-content: space-between; padding: 0.8rem 0;
      border-bottom: 1px solid var(--glass-border); font-size: 0.95rem;
    }
    .leaderboard-item:last-child { border-bottom: none; }
    .leaderboard-item.you { color: var(--accent); font-weight: 600; }
    .leaderboard-rank {
      width: 24px; height: 24px; border-radius: 50%; background: var(--primary);
      display: flex; align-items: center; justify-content: center; font-size: 0.8rem; margin-right: 0.5rem;
    }
    
    /* Progress Bar */
    .progress-bar {
      width: 100%; max-width: 600px; height: 6px; background: rgba(255,255,255,0.1);
      border-radius: 3px; margin: 1rem 0; overflow: hidden;
    }
    .progress-fill {
      height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary));
      border-radius: 3px; transition: width 0.3s ease;
    }
    
    /* Ad Space */
    .game-ad {
      width: 100%; max-width: 728px; margin: 1rem auto; padding: 0.8rem;
      background: var(--glass); border: 1px solid var(--glass-border);
      border-radius: 16px; text-align: center;
    }
    .ad-label { font-size: 0.7rem; color: var(--gray); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; display: block; }
    
    /* Responsive */
    @media (max-width: 600px) {
      .hud { gap: 1rem; font-size: 0.9rem; }
      .question-text { font-size: 1.1rem; }
      .option-btn { padding: 0.9rem 1.2rem; font-size: 0.95rem; }
    }
  </style>
</head>
<body>
  <header>
    <a href="../../produtos.html" class="back-btn"><i class="fas fa-arrow-left"></i> Hub</a>
    <h1 class="game-title">🧠 Quiz Master</h1>
    <div style="width: 60px;"></div>
  </header>
  
  <div class="hud">
    <div class="hud-item score"><i class="fas fa-star"></i> <span id="score">0</span></div>
    <div class="hud-item timer"><i class="fas fa-clock"></i> <span id="timer">15s</span></div>
    <div class="hud-item streak"><i class="fas fa-fire"></i> <span id="streak">0</span>x</div>

  <div id="gameContainer">
    
    <!-- Start Screen -->
    <div class="screen" id="startScreen">
      <h2>🧠 Quiz Master</h2>
      <p>Teste seu conhecimento! Escolha uma categoria e responda o máximo de perguntas que puder.</p>
      
      <div class="category-select">
        <button class="category-btn active" data-category="arte">
          <i class="fas fa-palette"></i> Arte
        </button>
        <button class="category-btn" data-category="cognicao">
          <i class="fas fa-brain"></i> Cognição
        </button>
        <button class="category-btn" data-category="geral">
          <i class="fas fa-globe"></i> Geral
        </button>
        <button class="category-btn" data-category="humor">
          <i class="fas fa-laugh"></i> Humor
        </button>
      </div>
      
      <button class="action-btn" id="startBtn"><i class="fas fa-play"></i> Começar Quiz</button>
    </div>
    
    <!-- Question Screen -->
    <div class="question-card" id="questionCard">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <p style="color: var(--gray); font-size: 0.9rem; margin-bottom: 0.5rem;">Pergunta <span id="questionNum">1</span> de <span id="totalQuestions">10</span></p>
      <div class="question-text" id="questionText"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="nextBtn">Próxima →</button>
    </div>
    
    <!-- Result Screen -->
    <div class="screen" id="resultScreen" style="display: none;">
      <h2>🎉 Quiz Completo!</h2>
      <p>Sua pontuação:</p>
      <div style="font-size: 3rem; font-weight: 800; color: var(--secondary); margin: 1rem 0;" id="finalScore">0</div>
      <p id="resultMessage"></p>
      <button class="action-btn" id="playAgainBtn"><i class="fas fa-redo"></i> Jogar Novamente</button>
    </div>
    
    <!-- Leaderboard -->
    <div class="leaderboard" id="leaderboard">
      <h3><i class="fas fa-trophy"></i> Ranking - <span id="leaderboardCategory">Arte</span></h3>
      <ul class="leaderboard-list" id="leaderboardList"></ul>
    </div>
    
  </div>
  
  <div class="game-ad">
    <span class="ad-label">Publicidade</span>
    <script async="async" data-cfasync="false" src="https://pl28845410.effectivegatecpm.com/3c2eb1000098aa584074fbf52f463bc0/invoke.js"></script>
    <div id="container-3c2eb1000098aa584074fbf52f463bc0"></div>
  </div>
  
  <script src="https://pl28876220.effectivegatecpm.com/30/b8/d1/30b8d1458b08c08f30d9f4f413e7a20d.js"></script>
  
  <script>
    // Banco de Perguntas
    const questions = {
      arte: [
        { q: "Qual técnica usa tinta diluída em água?", options: ["Óleo", "Aquarela", "Acrílico", "Guache"], a: 1 },
        { q: "Quem pintou a Mona Lisa?", options: ["Van Gogh", "Picasso", "Da Vinci", "Michelangelo"], a: 2 },
        { q: "Qual cor é primária na pintura?", options: ["Verde", "Roxo", "Azul", "Marrom"], a: 2 },
        { q: "O que é um autorretrato?", options: ["Paisagem", "Retrato de si mesmo", "Natureza morta", "Abstrato"], a: 1 },
        { q: "Qual material é usado na escultura?", options: ["Tela", "Argila", "Pincel", "Lápis"], a: 1 },
        { q: "O impressionismo surgiu em qual país?", options: ["Brasil", "Itália", "França", "Espanha"], a: 2 },
        { q: "Qual artista cortou a própria orelha?", options: ["Monet", "Van Gogh", "Dali", "Kahlo"], a: 1 },
        { q: "O que significa 'chiaroscuro'?", options: ["Cor vibrante", "Luz e sombra", "Pintura rápida", "Desenho técnico"], a: 1 },
        { q: "Qual é a tela mais famosa de Munch?", options: ["Noite Estrelada", "O Grito", "Persistência", "Guernica"], a: 1 },
        { q: "Arte abstrata não representa:", options: ["Emoções", "Formas", "Realidade fiel", "Cores"], a: 2 }
      ],
      cognicao: [
        { q: "Qual lado do cérebro é mais lógico?", options: ["Direito", "Esquerdo", "Ambos", "Nenhum"], a: 1 },
        { q: "Memória de curto prazo dura:", options: ["Segundos", "Minutos", "Horas", "Dias"], a: 1 },
        { q: "O que é neuroplasticidade?", options: ["Cérebro rígido", "Cérebro que muda", "Doença cerebral", "Tipo de neurônio"], a: 1 },
        { q: "Qual vitamina ajuda a memória?", options: ["A", "C", "D", "B12"], a: 3 },
        { q: "Sono ajuda a:", options: ["Esquecer", "Consolidar memória", "Perder tempo", "Ficar cansado"], a: 1 },
        { q: "Meditação melhora:", options: ["Só o corpo", "Atenção e foco", "Só a respiração", "Nada"], a: 1 },
        { q: "Qual jogo treina memória?", options: ["Xadrez", "Memory Match", "Poker", "Todos"], a: 3 },
        { q: "Estresse crônico afeta:", options: ["Só o humor", "Memória e aprendizado", "Só o corpo", "Nada"], a: 1 },
        { q: "Aprendizado ativo significa:", options: ["Só ouvir", "Participar e praticar", "Ler passivamente", "Copiar"], a: 1 },
        { q: "Qual idade o cérebro para de se desenvolver?", options: ["18 anos", "25 anos", "40 anos", "Nunca para"], a: 3 }
      ],
      geral: [
        { q: "Quantos continentes existem?", options: ["4", "5", "6", "7"], a: 3 },
        { q: "Qual é o maior planeta do sistema solar?", options: ["Terra", "Marte", "Júpiter", "Saturno"], a: 2 },
        { q: "Quem escreveu Dom Casmurro?", options: ["José de Alencar", "Machado de Assis", "Clarice Lispector", "Jorge Amado"], a: 1 },
        { q: "Qual elemento químico tem símbolo 'O'?", options: ["Ouro", "Oxigênio", "Osmio", "Ósmio"], a: 1 },
        { q: "Em que ano o homem pisou na Lua?", options: ["1965", "1969", "1972", "1959"], a: 1 },
        { q: "Qual é a capital do Brasil?", options: ["São Paulo", "Rio de Janeiro", "Brasília", "Salvador"], a: 2 },
        { q: "Quantas cores tem o arco-íris?", options: ["5", "6", "7", "8"], a: 2 },
        { q: "Qual animal é conhecido como rei da selva?", options: ["Tigre", "Leão", "Elefante", "Urso"], a: 1 },
        { q: "Qual instrumento mede temperatura?", options: ["Barômetro", "Termômetro", "Higrômetro", "Anemômetro"], a: 1 },
        { q: "Qual é o menor país do mundo?", options: ["Mônaco", "Vaticano", "San Marino", "Liechtenstein"], a: 1 }
      ],
      humor: [
        { q: "Por que o frango atravessou a rua?", options: ["Para fugir", "Para chegar do outro lado", "Porque sim", "Não sabemos"], a: 1 },
        { q: "O que o zero disse para o oito?", options: ["Que legal!", "Belo cinto!", "Vamos somar?", "Sou maior"], a: 1 },
        { q: "Qual é o café preferido do fantasma?", options: ["Expresso", "Cappuccino", "Assombrado", "Sem açúcar"], a: 2 },
        { q: "Por que o livro de matemática estava triste?", options: ["Tinha muitos problemas", "Ninguém lia", "Era chato", "Estava rasgado"], a: 0 },
        { q: "O que uma parede disse para a outra?", options: ["Te vejo no canto!", "Vamos nos juntar!", "Que tédio!", "Sou mais alta"], a: 0 },
        { q: "Qual é o animal mais antigo?", options: ["Dinossauro", "Tartaruga", "A piada", "Fóssil"], a: 2 },
        { q: "Por que a galinha não atravessou o playground?", options: ["Estava chovendo", "Era domingo", "Jogo de palavras", "Medo"], a: 2 },
        { q: "O que o pato disse quando comprou batom?", options: ["Que fofo!", "Põe na conta!", "Quack!", "Adorei"], a: 1 },
        { q: "Qual é a comida favorita do vampiro?", options: ["Alho", "Pescoço", "Vegetariano", "Sopa"], a: 1 },
        { q: "Por que o esqueleto não brigou?", options: ["Não tinha estômago", "Estava cansado", "Era pacífico", "Não tinha corpo"], a: 0 }
      ]
    };
    
    // Estado do jogo
    let currentCategory = 'arte';
    let currentQuestions = [];
    let questionIndex = 0;
    let score = 0;
    let streak = 0;
    let timeLeft = 15;
    let timerInterval;
    let answered = false;
    
    // DOM Elements
    const startScreen = document.getElementById('startScreen');
    const questionCard = document.getElementById('questionCard');
    const resultScreen = document.getElementById('resultScreen');
    const questionText = document.getElementById('questionText');
    const optionsEl = document.getElementById('options');
    const feedbackEl = document.getElementById('feedback');
    const nextBtn = document.getElementById('nextBtn');
    const scoreEl = document.getElementById('score');
    const timerEl = document.getElementById('timer');
    const streakEl = document.getElementById('streak');
    const questionNumEl = document.getElementById('questionNum');
    const totalQuestionsEl = document.getElementById('totalQuestions');
    const progressFill = document.getElementById('progressFill');
    const finalScoreEl = document.getElementById('finalScore');
    const resultMessageEl = document.getElementById('resultMessage');
    const leaderboardList = document.getElementById('leaderboardList');
    const leaderboardCategoryEl = document.getElementById('leaderboardCategory');
    
    // Inicialização
    function init() {
      // Seleção de categoria
      document.querySelectorAll('.category-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          currentCategory = this.dataset.category;
          leaderboardCategoryEl.textContent = this.textContent.trim();
          loadLeaderboard();
        });
      });
      
      // Start
      document.getElementById('startBtn').addEventListener('click', startQuiz);
      document.getElementById('playAgainBtn').addEventListener('click', startQuiz);
      nextBtn.addEventListener('click', nextQuestion);
      
      // Carregar ranking inicial
      loadLeaderboard();
    }
    
    function startQuiz() {
      score = 0; streak = 0; questionIndex = 0;
      scoreEl.textContent = '0'; streakEl.textContent = '0';
      
      // Embaralhar e selecionar 10 perguntas
      currentQuestions = [...questions[currentCategory]]
        .sort(() => Math.random() - 0.5)
        .slice(0, 10);
      
      totalQuestionsEl.textContent = currentQuestions.length;
      
      startScreen.style.display = 'none';
      resultScreen.style.display = 'none';
      questionCard.style.display = 'block';
      
      loadQuestion();
    }
    
    function loadQuestion() {
      answered = false;
      const q = currentQuestions[questionIndex];
      
      // Atualizar UI
      questionNumEl.textContent = questionIndex + 1;
      questionText.textContent = q.q;
      progressFill.style.width = `${((questionIndex) / currentQuestions.length) * 100}%`;
      
      // Opções
      optionsEl.innerHTML = '';
      const letters = ['A', 'B', 'C', 'D'];
      q.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span class="option-letter">${letters[i]}</span> ${opt}`;
        btn.addEventListener('click', () => selectAnswer(i, btn));
        optionsEl.appendChild(btn);
      });
      
      // Reset feedback
      feedbackEl.style.display = 'none';
      feedbackEl.className = 'feedback';
      nextBtn.style.display = 'none';
      
      // Timer
      timeLeft = 15;
      timerEl.textContent = `${timeLeft}s`;
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        timerEl.textContent = `${timeLeft}s`;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          timeUp();
        }
      }, 1000);
    }
    
    function selectAnswer(selectedIndex, btn) {
      if (answered) return;
      answered = true;
      clearInterval(timerInterval);
      
      const q = currentQuestions[questionIndex];
      const options = optionsEl.querySelectorAll('.option-btn');
      
      // Desabilitar todas
      options.forEach(opt => opt.disabled = true);
      
      // Mostrar resposta correta/errada
      if (selectedIndex === q.a) {
        btn.classList.add('correct');
        feedbackEl.textContent = '✅ Correto! +10 pontos';
        feedbackEl.className = 'feedback correct';
        
        // Bônus de streak
        streak++;
        streakEl.textContent = streak;
        const points = 10 + (streak > 2 ? streak * 2 : 0);
        score += points;
        scoreEl.textContent = score;
        
        if (streak > 2) {
          feedbackEl.textContent += ` (+${streak*2} bônus!)`;
        }
      } else {
        btn.classList.add('incorrect');
        options[q.a].classList.add('correct');
        feedbackEl.textContent = `❌ Errado! A resposta era: ${q.options[q.a]}`;
        feedbackEl.className = 'feedback incorrect';
        streak = 0;
        streakEl.textContent = '0';
      }
      
      feedbackEl.style.display = 'block';
      nextBtn.style.display = 'inline-flex';
      
      // Verificar fim do quiz
      if (questionIndex >= currentQuestions.length - 1) {
        nextBtn.textContent = 'Ver Resultado →';
      }
    }
    
    function timeUp() {
      if (answered) return;
      answered = true;
      
      const q = currentQuestions[questionIndex];
      const options = optionsEl.querySelectorAll('.option-btn');
      options.forEach(opt => opt.disabled = true);
      options[q.a].classList.add('correct');
      
      feedbackEl.textContent = `⏰ Tempo esgotado! Resposta: ${q.options[q.a]}`;
      feedbackEl.className = 'feedback incorrect';
      feedbackEl.style.display = 'block';
      
      streak = 0;
      streakEl.textContent = '0';
      
      nextBtn.style.display = 'inline-flex';
      if (questionIndex >= currentQuestions.length - 1) {
        nextBtn.textContent = 'Ver Resultado →';
      }
    }
    
    function nextQuestion() {
      questionIndex++;
      
      if (questionIndex < currentQuestions.length) {
        loadQuestion();
      } else {
        endQuiz();
      }
    }
    
    function endQuiz() {
      questionCard.style.display = 'none';
      resultScreen.style.display = 'block';
      finalScoreEl.textContent = score;
      
      // Mensagem personalizada
      const percentage = (score / (currentQuestions.length * 10)) * 100;
      if (percentage >= 90) {
        resultMessageEl.textContent = '🏆 Excelente! Você é um mestre do conhecimento!';
      } else if (percentage >= 70) {
        resultMessageEl.textContent = '🌟 Muito bom! Continue praticando!';
      } else if (percentage >= 50) {
        resultMessageEl.textContent = '👍 Bom esforço! Tente novamente para melhorar!';
      } else {
        resultMessageEl.textContent = '💪 Não desista! Pratique mais e volte!';
      }
      
      // Salvar no ranking
      saveToLeaderboard(score);
      loadLeaderboard();
    }
    
    // Sistema de Ranking com localStorage
    function saveToLeaderboard(newScore) {
      const key = `quiz_leaderboard_${currentCategory}`;
      let leaderboard = JSON.parse(localStorage.getItem(key) || '[]');
      
      // Adicionar nova pontuação (anônima ou com nome se quiser expandir)
      leaderboard.push({
        score: newScore,
        date: new Date().toISOString(),
        name: `Jogador #${Math.floor(Math.random() * 9000) + 1000}`
      });
      
      // Ordenar e manter top 10
      leaderboard = leaderboard.sort((a, b) => b.score - a.score).slice(0, 10);
      localStorage.setItem(key, JSON.stringify(leaderboard));
    }
    
    function loadLeaderboard() {
      const key = `quiz_leaderboard_${currentCategory}`;
      const leaderboard = JSON.parse(localStorage.getItem(key) || '[]');
      
      leaderboardList.innerHTML = '';
      
      if (leaderboard.length === 0) {
        leaderboardList.innerHTML = '<li class="leaderboard-item">Seja o primeiro a jogar!</li>';
        return;
      }
      
      leaderboard.forEach((entry, index) => {
        const li = document.createElement('li');
        li.className = 'leaderboard-item';
        li.innerHTML = `
          <span><span class="leaderboard-rank">${index + 1}</span> ${entry.name}</span>
          <span style="color: var(--secondary); font-weight: 600;">${entry.score} pts</span>
        `;
        leaderboardList.appendChild(li);
      });
    }
    
    // Iniciar
    init();
  </script>
