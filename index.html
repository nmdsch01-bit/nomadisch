<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nomadisch</title>
  <style>
    /* Remove margens e preenche tela inteira */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    /* Container do GIF */
    .hero {
      position: relative;
      width: 100%;
      height: 100%;
      background: url('GIF-da-capa-do-site.gif') no-repeat center center;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Botão centralizado */
    .btn {
      padding: 20px 40px;
      background-color: #28a745; /* verde */
      color: white;
      font-size: 24px;
      text-decoration: none;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      transition: background-color 0.3s, transform 0.2s;
    }

    .btn:hover {
      background-color: #1e7e34;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="hero">
    <a href="produtos.html" class="btn">Start Here</a>
  </div>
</body>
</html>
