<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recommended Digital Products | Nomadisch</title>

  <!-- SEO básico -->
  <meta name="description" content="Discover carefully selected digital products and guides designed to help you build skills, save money, and create real projects at home.">

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #ffffff;
      margin: 0;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    p.subtitle {
      text-align: center;
      margin-bottom: 40px;
      font-size: 18px;
      color: #555;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px;
    }

    .card {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      text-align: center;
      background-color: #fafafa;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    .card img {
      max-width: 100%;
      border-radius: 8px;
    }

    .card h2 {
      font-size: 20px;
      margin: 15px 0 10px;
    }

    .card p {
      font-size: 16px;
      color: #555;
    }

    .btn {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 24px;
      background-color: #28a745;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .btn:hover {
      background-color: #1e7e34;
    }
  </style>
</head>

<body>
<div class="container">

  <h1>Recommended Digital Products</h1>
  <p class="subtitle">
    Practical guides and systems designed to help you build real skills and projects.
  </p>

  <div class="grid">

    <!-- TED'S WOODWORKING -->
    <div class="card">
      <img src="assets/WOOD2.jpg" alt="Woodworking projects at home">
      <h2>Woodworking Projects for Beginners</h2>
      <p>
        Learn how to build furniture, outdoor projects, and home improvements using
        step-by-step woodworking plans.
      </p>
      <a href="teds-woodworking.html" class="btn">
        Learn More
      </a>
    </div>

    <!-- PRÓXIMOS PRODUTOS ENTRAM AQUI -->

  </div>

</div>
</body>
</html>
