<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qual corte de cabelo combina com você?</title>
<style>
body {
    font-family: Arial, sans-serif;
    margin:0;
    background: url('imagescortes/salao.jpg') center/cover no-repeat;
    color:#333;
}
.quiz-box {
    max-width:600px;
    margin:50px auto;
    background: rgba(255,255,255,0.95);
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    text-align:center;
}
h1 { text-align:center; font-size:26px; margin-bottom:20px;}
.progress {height:10px; background:#eee; border-radius:20px; margin-bottom:20px; overflow:hidden;}
.progress-bar {height:10px; width:0%; background:#ff4d6d; border-radius:20px; transition:0.4s;}
.option {background:#f3f3f3; padding:14px; margin:10px 0; border-radius:10px; cursor:pointer; transition:0.3s;}
.option:hover {background:#ffdde1;}
.loader { display:none; text-align:center; font-size:18px; margin-top:20px;}
.ad-container {margin:20px 0; display:flex; justify-content:center;}
</style>
</head>
<body>

<!-- ADSTERRA TOPO -->
<div class="ad-container">
<script async="async" data-cfasync="false" src="https://pl28845410.effectivegatecpm.com/3c2eb1000098aa584074fbf52f463bc0/invoke.js"></script>
<div id="container-3c2eb1000098aa584074fbf52f463bc0"></div>
</div>

<div class="quiz-box">
<h1>Qual corte de cabelo combina com sua personalidade?</h1>
<div class="progress"><div class="progress-bar" id="barra"></div></div>
<div id="pergunta"></div>
<div id="respostas"></div>
<div class="loader" id="loader">Calculando resultado... ⏳</div>
</div>

<!-- ADSTERRA RODAPÉ -->
<div class="ad-container">
<script async="async" data-cfasync="false" src="https://www.highperformanceformat.com/3b682b95b642d285fbebc498d78d27dc/invoke.js"></script>
</div>

<script>
// Perguntas e respostas
const perguntas = [
  { pergunta:"Como você reage a mudanças?", respostas:[
    ["Adoro mudar tudo","pixie"],
    ["Mudanças planejadas","chanel"],
    ["Gosto de reinventar","repicado"],
    ["Prefiro estabilidade","medio"],
    ["Mudanças refletem identidade","afro"]
  ]},
  { pergunta:"Qual energia mais te define?", respostas:[
    ["Corajosa","pixie"],["Elegante","chanel"],["Criativa","repicado"],["Equilibrada","medio"],["Poderosa","afro"]
  ]},
  { pergunta:"Seu estilo é mais...", respostas:[
    ["Moderno","pixie"],["Clássico","chanel"],["Despojado","repicado"],["Natural","medio"],["Autêntico","afro"]
  ]},
  { pergunta:"Como as pessoas te veem?", respostas:[
    ["Ousada","pixie"],["Sofisticada","chanel"],["Divertida","repicado"],["Calma","medio"],["Forte","afro"]
  ]},
  { pergunta:"Qual palavra melhor te descreve?", respostas:[
    ["Liberdade","pixie"],["Elegância","chanel"],["Criatividade","repicado"],["Harmonia","medio"],["Identidade","afro"]
  ]},
  { pergunta:"Seu visual ideal é...", respostas:[
    ["Prático","pixie"],["Chique","chanel"],["Leve","repicado"],["Versátil","medio"],["Natural","afro"]
  ]},
  { pergunta:"Seu maior ponto forte?", respostas:[
    ["Coragem","pixie"],["Classe","chanel"],["Espontaneidade","repicado"],["Equilíbrio","medio"],["Personalidade","afro"]
  ]},
  { pergunta:"Você prefere...", respostas:[
    ["Minimalismo","pixie"],["Estilo atemporal","chanel"],["Movimento","repicado"],["Naturalidade","medio"],["Orgulho cultural","afro"]
  ]},
  { pergunta:"Seu humor diário é...", respostas:[
    ["Independente","pixie"],["Elegante","chanel"],["Livre","repicado"],["Tranquilo","medio"],["Empoderado","afro"]
  ]},
  { pergunta:"Qual visual te atrai mais?", respostas:[
    ["Moderno","pixie"],["Clássico","chanel"],["Despojado","repicado"],["Natural","medio"],["Poderoso","afro"]
  ]},
  { pergunta:"Qual seu objetivo com o corte?", respostas:[
    ["Ser ousada","pixie"],["Mostrar classe","chanel"],["Ter movimento","repicado"],["Versátil","medio"],["Expressar cultura","afro"]
  ]},
  { pergunta:"Como seu cabelo reflete você?", respostas:[
    ["Independência","pixie"],["Elegância","chanel"],["Criatividade","repicado"],["Equilíbrio","medio"],["Autenticidade","afro"]
  ]}
];

let atual = 0;
let pontos = { pixie:0, chanel:0, repicado:0, medio:0, afro:0 };

// Carregar pergunta
function carregarPergunta(){
  if(atual >= perguntas.length){
    mostrarLoader();
    return;
  }
  let q = perguntas[atual];
  document.getElementById("pergunta").innerText = q.pergunta;
  let respostasHTML="";
  q.respostas.forEach(r=>{
    respostasHTML += `<div class="option" onclick="responder('${r[1]}')">${r[0]}</div>`;
  });
  document.getElementById("respostas").innerHTML = respostasHTML;
  document.getElementById("barra").style.width = ((atual/perguntas.length)*100)+"%";
}

// Responder
function responder(tipo){
  pontos[tipo]++;
  atual++;
  carregarPergunta();
}

// Loader falso
function mostrarLoader(){
  document.getElementById("pergunta").style.display="none";
  document.getElementById("respostas").style.display="none";
  document.getElementById("barra").style.width="100%";
  const loader = document.getElementById("loader");
  loader.style.display="block";
  // Script para aumentar tempo de permanência
  let tempoExtra = 4000 + Math.floor(Math.random()*2000);
  setTimeout(finalizar, tempoExtra);
}

// Finalizar
function finalizar(){
  let vencedor = Object.keys(pontos).reduce((a,b)=>pontos[a]>pontos[b]?a:b);
  localStorage.setItem("resultadoCabelo",vencedor);
  window.location.href="resultado-corte.html";
}

// Começa quiz
carregarPergunta();
</script>
</body>
</html>
