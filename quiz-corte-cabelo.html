<body>

<div class="ad"><script async="async" data-cfasync="false" src="https://pl28845410.effectivegatecpm.com/3c2eb1000098aa584074fbf52f463bc0/invoke.js"></script>

<h1>Descubra seu corte ideal ✨</h1>

<div class="progress">
<div class="progress-bar" id="bar"></div>
</div>

<div id="question"></div>

<div id="answers"></div>

</div>

<div id="loader" class="loader">
<p id="loadingText">Analisando seu estilo...</p>

<div class="ad"><script <script>

</script>
<script src="https://www.highperformanceformat.com/3b682b95b642d285fbebc498d78d27dc/invoke.js"></script>> </div>

</div>

<script>

const loadingTexts=[
"Analisando seu estilo...",
"Comparando com tendências...",
"Calculando corte ideal...",
"Quase pronto..."
]

const results={
bob:"Long Bob Moderno",
borboleta:"Corte Borboleta",
shaggy:"Shaggy Hair",
chanel:"Chanel Elegante",
camadas:"Camadas Hollywood"
}

const questions=[
{
q:"Qual vibe combina com você?",
a:["Elegante","Moderna","Despojada","Clássica","Glamourosa"]
},
{
q:"Seu cabelo hoje é:",
a:["Longo","Médio","Curto","Ondulado","Cacheado"]
},
{
q:"Você gosta de:",
a:["Volume","Movimento","Praticidade","Elegância","Moda"]
},
{
q:"Seu estilo de roupa:",
a:["Fashion","Casual","Romântico","Minimalista","Chique"]
},
{
q:"No salão você prefere:",
a:["Mudança radical","Só ajustar","Algo moderno","Algo clássico","Surpresa"]
},
{
q:"Seu rosto é mais:",
a:["Oval","Redondo","Quadrado","Coração","Longo"]
},
{
q:"Seu cabelo é:",
a:["Liso","Ondulado","Cacheado","Volumoso","Fino"]
},
{
q:"Você gosta de franja?",
a:["Sim","Talvez","Não","Curtinha","Longa"]
},
{
q:"Quanto tempo dedica ao cabelo?",
a:["Muito","Médio","Pouco","Quase nada","Depende"]
},
{
q:"Você segue tendências?",
a:["Sempre","Às vezes","Não","Amo moda","Depende"]
},
{
q:"Celebridade que inspira?",
a:["Zendaya","Taylor Swift","Gigi Hadid","Emma Stone","Margot Robbie"]
},
{
q:"Qual palavra define seu estilo?",
a:["Elegância","Moda","Praticidade","Beleza","Personalidade"]
}
]

let current=0
let answers=[]

function showQuestion(){

const q=questions[current]

document.getElementById("question").innerHTML="<h2>"+q.q+"</h2>"

const answersDiv=document.getElementById("answers")
answersDiv.innerHTML=""

q.a.forEach((a,i)=>{
const btn=document.createElement("button")
btn.innerText=a
btn.onclick=()=>selectAnswer(i)
answersDiv.appendChild(btn)
})

updateBar()

}

function selectAnswer(i){

answers.push(i)

if(current<questions.length-1){

current++
showQuestion()

}else{

showLoader()

}

}

function updateBar(){

let p=(current/questions.length)*100
document.getElementById("bar").style.width=p+"%"

}

function showLoader(){

document.getElementById("quiz").style.display="none"
document.getElementById("loader").style.display="block"

let t=0

const interval=setInterval(()=>{
document.getElementById("loadingText").innerText=loadingTexts[t%loadingTexts.length]
t++
},1500)

setTimeout(()=>{

clearInterval(interval)

showResult()

},4500)

}

function showResult(){

document.getElementById("loader").style.display="none"

const keys=Object.keys(results)

const r=keys[Math.floor(Math.random()*keys.length)]

document.getElementById("result").style.display="block"

document.getElementById("result").innerHTML=

"<h2>Seu corte ideal é:</h2>"+
"<h1>"+results[r]+"</h1>"+

'<button onclick="sharePinterest()">Salvar no Pinterest</button>'+

'<button onclick="location.reload()">Refazer Quiz</button>'

}

function sharePinterest(){

const url=encodeURIComponent(location.href)

window.open("https://pinterest.com/pin/create/button/?url="+url)

}

showQuestion()

</script>

</body>
</html>
