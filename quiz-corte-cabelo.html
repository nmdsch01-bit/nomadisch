<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resultado do seu corte</title>
<style>
body {
    font-family: Arial, sans-serif;
    margin:0;
    background: url('imagescortes/salao.jpg') center/cover no-repeat;
    color:#333;
}
.result-box {
    max-width:700px;
    margin:50px auto;
    background: rgba(255,255,255,0.95);
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    text-align:center;
}
.result-box img {
    width:300px;
    border-radius:15px;
    margin:20px 0;
}
.result-box h1 {
    font-size:28px;
    margin-bottom:15px;
}
.result-box p {
    font-size:18px;
    line-height:1.6;
}
button, .pinterest-btn {
    padding:14px 20px;
    margin:10px 5px;
    font-size:16px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}
button {
    background:#ff4d6d;
    color:white;
}
button:hover {background:#ff1a4d;}
.pinterest-btn {
    background:#bd081c;
    color:white;
}
.pinterest-btn:hover {background:#8b0614;}
.ad-container {margin:20px 0; display:flex; justify-content:center;}
</style>
</head>
<body>

<!-- ADSTERRA TOPO -->
<div class="ad-container">
<script async="async" data-cfasync="false" src="https://pl28845410.effectivegatecpm.com/3c2eb1000098aa584074fbf52f463bc0/invoke.js"></script>
<div id="container-3c2eb1000098aa584074fbf52f463bc0"></div>
</div>

<div class="result-box">
<h1>Seu corte de cabelo ideal é...</h1>
<h2 id="corte"></h2>
<img id="imagem" src="" alt="Imagem do corte">
<p id="desc"></p>

<!-- ADSTERRA MEIO -->
<div class="ad-container">
<script async="async" data-cfasync="false" src="https://www.highperformanceformat.com/3b682b95b642d285fbebc498d78d27dc/invoke.js"></script>
</div>

<button onclick="location.href='quiz-corte-cabelo.html'">Refazer Quiz</button>
<button class="pinterest-btn" onclick="compartilharPinterest()">📌 Compartilhar no Pinterest</button>
</div>

<!-- ADSTERRA RODAPÉ -->
<div class="ad-container">
<script async="async" data-cfasync="false" src="https://pl28845410.effectivegatecpm.com/3c2eb1000098aa584074fbf52f463bc0/invoke.js"></script>
<div id="container-3c2eb1000098aa584074fbf52f463bc0"></div>
</div>

<script>
// Recebe resultado do quiz
const vencedor = localStorage.getItem("resultadoCabelo");

// Mapas dos cortes com descrição e imagem
const cortes = {
    pixie: {
        nome:"Pixie",
        img:"imagescortes/pixie.jpg",
        desc:"O Pixie representa ousadia e liberdade. Você é moderna, corajosa e pronta para transformar seu estilo em um instante."
    },
    chanel: {
        nome:"Chanel Clássico",
        img:"imagescortes/chanel.jpg",
        desc:"O Chanel clássico reflete elegância e sofisticação. Você valoriza estilo atemporal e classe em cada detalhe."
    },
    repicado: {
        nome:"Repicado Ombro",
        img:"imagescortes/repicado.jpg",
        desc:"O repicado mostra criatividade e movimento. Você gosta de se reinventar, trazendo energia e espontaneidade ao seu visual."
    },
    medio: {
        nome:"Cabelo Médio",
        img:"imagescortes/medio.jpg",
        desc:"O cabelo médio transmite equilíbrio e versatilidade. Seu estilo é natural, harmônico e adaptável a qualquer ocasião."
    },
    afro: {
        nome:"Corte Africano",
        img:"imagescortes/afro.jpg",
        desc:"O corte africano representa identidade e força cultural. Você exibe personalidade marcante e orgulho das suas raízes."
    }
};

// Atualiza DOM
if(cortes[vencedor]){
    document.getElementById("corte").innerText = cortes[vencedor].nome;
    document.getElementById("imagem").src = cortes[vencedor].img;
    document.getElementById("desc").innerText = cortes[vencedor].desc;
} else {
    document.getElementById("corte").innerText = "Não foi possível identificar seu corte";
    document.getElementById("desc").innerText = "Volte ao quiz e tente novamente.";
}

// Compartilhar no Pinterest
function compartilharPinterest(){
    const url = encodeURIComponent(window.location.href);
    const media = encodeURIComponent(document.getElementById("imagem").src);
    const description = encodeURIComponent("Descubra qual corte de cabelo combina com você!");
    window.open(`https://www.pinterest.com/pin/create/button/?url=${url}&media=${media}&description=${description}`, '_blank');
}
</script>

</body>
</html>
