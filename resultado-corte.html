<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seu Corte Ideal</title>

<style>
body{
    font-family:Arial, sans-serif;
    margin:0;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    text-align:center;
    min-height:100vh;
}
.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:30px;
    margin-top:50px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}
h1{
    font-size:30px;
    margin-bottom:15px;
}
h2{
    font-size:24px;
    margin-bottom:10px;
}
img{
    width:90%;
    max-width:400px;
    border-radius:15px;
    margin-top:20px;
}
p{
    font-size:18px;
    margin-top:15px;
}
button{
    padding:14px 22px;
    font-size:18px;
    border:none;
    border-radius:10px;
    margin-top:25px;
    cursor:pointer;

    color:white;
}
button:hover{
    background:#ff2d55;
}
.ad{
    margin:25px 0;
}

</head>
<body>

<div class="container">

    <h1 id="titulo">Seu corte ideal é...</h1>

    <!-- ADSTERRA TOPO -->
    <div class="ad">
        <script async="async" data-cfasync="false" src="https://pl28845410.effectivegatecpm.com/3c2eb1000098aa584074fbf52f463bc0/invoke.js"></script>
        <div id="container-3c2eb1000098aa584074fbf52f463bc0"></div>
    </div>

    <h2 id="nome"></h2>
    <img id="imagem" src="">
    <p id="desc"></p>

    <button onclick="location.href='quiz-corte-cabelo.html'">Refazer Teste</button>

    <!-- ADSTERRA MEIO -->
    <div class="ad">
        <script async="async" data-cfasync="false" src="https://pl28845410.effectivegatecpm.com/3c2eb1000098aa584074fbf52f463bc0/invoke.js"></script>
        <div id="container-3c2eb1000098aa584074fbf52f463bc0"></div>
    </div>

</div>

<!-- ADSTERRA RODAPÉ -->
<div class="ad">
    <script async="async" data-cfasync="false" src="https://pl28845410.effectivegatecpm.com/3c2eb1000098aa584074fbf52f463bc0/invoke.js"></script>
    <div id="container-3c2eb1000098aa584074fbf52f463bc0"></div>
</div>

<script>

let resultado = localStorage.getItem("resultadoCabelo")

if(!resultado){
    document.getElementById("nome").innerText="Nenhum resultado encontrado"
    document.getElementById("desc").innerText="Volte ao quiz e descubra seu corte ideal."
} else {

const cortes = {
  pixie:{
    nome:"Pixie moderno",
    img:"imagescortes/pixie.jpg",
    desc:"Você é ousada, moderna e independente. O corte pixie reflete sua autenticidade."
  },
  chanel:{
    nome:"Chanel clássico",
    img:"imagescortes/chanel.jpg",
    desc:"Elegância e sofisticação definem você. O corte chanel combina com seu estilo atemporal."
  },
  repicado:{
    nome:"Repicado no ombro",
    img:"imagescortes/repicado.jpg",
    desc:"Leve e criativa. Esse corte entrega movimento e personalidade."
  },
  medio:{
    nome:"Cabelo médio elegante",
    img:"imagescortes/medio.jpg",
    desc:"Equilíbrio e versatilidade são sua marca. Ótimo para muitas ocasiões."
  },
  afro:{
    nome:"Afro natural poderoso",
    img:"imagescortes/afro.jpg",
    desc:"Autenticidade, orgulho e beleza definem você. O afro celebra sua identidade."
  }
}

document.getElementById("nome").innerText = cortes[resultado].nome
document.getElementById("imagem").src = cortes[resultado].img
document.getElementById("desc").innerText = cortes[resultado].desc

}

</script>

</body>
</html>
