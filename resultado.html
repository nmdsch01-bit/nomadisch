<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Seu Animal</title>

<style>

body{
font-family:Arial;
text-align:center;
background:#f4f4f4;
}

.result{
background:white;
max-width:700px;
margin:auto;
padding:30px;
}

img{
width:300px;
border-radius:10px;
}

button{
padding:15px;
margin-top:20px;
font-size:18px;
}

</style>
</head>

<body>

<div class="result">

<h1>Seu Animal de Poder é...</h1>

<h2 id="animal"></h2>

<img id="imagem">

<p id="desc"></p>

<button onclick="location.href='quiz.html'">Refazer</button>

</div>

<script>

const data = JSON.parse(localStorage.getItem("quizResult"))

let winner = Object.keys(data).reduce((a,b)=>data[a]>data[b]?a:b)

const animals = {

lobo:{
nome:"Lobo",
img:"imagesanimaispoder/lobo.jpg",
desc:"Você é leal, protetor e valoriza sua tribo."
},

aguia:{
nome:"Águia",
img:"imagesanimaispoder/aguia.jpg",
desc:"Você tem visão, liberdade e espírito explorador."
},

urso:{
nome:"Urso",
img:"imagesanimaispoder/urso.jpg",
desc:"Você é forte, protetor e resiliente."
},

tigre:{
nome:"Tigre",
img:"imagesanimaispoder/tigre.jpg",
desc:"Você é intenso, corajoso e dominante."
},

coruja:{
nome:"Coruja",
img:"imagesanimaispoder/coruja.jpg",
desc:"Você é sábio, observador e estratégico."
}

}

document.getElementById("animal").innerText = animals[winner].nome

document.getElementById("imagem").src = animals[winner].img

document.getElementById("desc").innerText = animals[winner].desc

</script>

</body>
</html>
