<script>

const animais = {

lobo:{
titulo:"Seu Animal de Poder é o LOBO",
img:"https://i.imgur.com/2JgK5Gx.png",
texto:"Você possui espírito de liderança, forte instinto e grande conexão com sua intuição."
},

aguia:{
titulo:"Seu Animal de Poder é a ÁGUIA",
img:"https://i.imgur.com/3nVq6jS.png",
texto:"Você enxerga além do óbvio. Sua visão espiritual e inteligência estratégica são seu maior poder."
},

coruja:{
titulo:"Seu Animal de Poder é a CORUJA",
img:"https://i.imgur.com/dH9sM4X.png",
texto:"Você possui sabedoria profunda, percepção silenciosa e grande capacidade de entender as pessoas."
},

tigre:{
titulo:"Seu Animal de Poder é o TIGRE",
img:"https://i.imgur.com/3Yk6bFq.png",

}

function mostrarResultado(){

let resultado = localStorage.getItem("animalResultado");

if(!resultado){
resultado="lobo";
}

let animal = animais[resultado];

document.getElementById("animalTitulo").innerText = animal.titulo;

document.getElementById("animalTexto").innerText = animal.texto;

document.getElementById("animalImg").src = animal.img;

}

function refazer(){

}

mostrarResultado();
