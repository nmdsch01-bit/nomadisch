<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado do Quiz</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #0d1117;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 550px;
            background: #161b22;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(255,255,255,0.1);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 26px;
            text-transform: uppercase;
        }

        img {
            width: 100%;
            border-radius: 12px;
            margin-top: 20px;
        }

        .descricao {
            margin-top: 20px;
            font-size: 18px;
            line-height: 1.5;
        }

        .btn {
            margin-top: 25px;
            display: inline-block;
            padding: 12px 22px;
            background: #238636;
            border-radius: 8px;
            text-decoration: none;
            color: #fff;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
        }

        .btn:hover {
            background: #2ea043;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 id="tituloAnimal">Seu Animal Poderoso é...</h1>

        <img id="imgAnimal" src="" alt="Animal Poderoso">

        <div class="descricao" id="descricaoAnimal"></div>

        <a class="btn" href="index.html">Refazer Quiz</a>
    </div>

    <script>
        // pega o resultado salvo pelo quiz
        const resultado = localStorage.getItem("animalEscolhido");

        // caso a página seja acessada direto
        if (!resultado) {
            document.getElementById("tituloAnimal").innerText =
                "Nenhum resultado encontrado!";
            document.getElementById("descricaoAnimal").innerText =
                "Volte ao quiz e responda para descobrir seu animal poderoso!";
        }

        // textos e imagens associados com cada animal
        const dadosAnimais = {
            "lobo": {
                nome: "Lobo",
                img: "imagesanimaispoder/lobo.jpg",
                desc: "Você é estrategista, leal e guiado por um forte senso de propósito."
            },
            "aguia": {
                nome: "Águia",
                img: "imagesanimaispoder/aguia.jpg",
                desc: "Você possui visão ampla, sabedoria e capacidade de enxergar oportunidades antes dos outros."
            },
            "urso": {
                nome: "Urso",
                img: "imagesanimaispoder/urso.jpg",
                desc: "Você é forte, protetor e profundamente intuitivo, mesmo quando está em silêncio."
            },
            "tigre": {
                nome: "Tigre",
                img: "imagesanimaispoder/tigre.jpg",
                desc: "Corajoso, intenso e determinado. Seu espírito nunca recua diante de desafios."
            },
            "coruja": {
                nome: "Coruja",
                img: "imagesanimaispoder/coruja.jpg",
                desc: "Você é um buscador da verdade, guiado pela sabedoria e pela observação profunda."
            },
            "cavalo": {
                nome: "Cavalo",
                img: "imagesanimaispoder/cavalo.jpg",
                desc: "Livre, energético e movido por um espírito indomável."
            },
            "serpente": {
                nome: "Serpente",
                img: "imagesanimaispoder/serpente.jpg",
                desc: "Transformação, renascimento e profundo conhecimento interior definem sua energia."
            },
            "pantera": {
                nome: "Pantera",
                img: "imagesanimaispoder/pantera.jpg",
                desc: "Elegante, intensa e misteriosa. Uma força silenciosa que domina qualquer ambiente."
            },
            "golfinho": {
                nome: "Golfinho",
                img: "imagesanimaispoder/golfinho.jpg",
                desc: "Você é leve, inteligente e conectado ao mundo emocional ao seu redor."
            },
            "falcao": {
                nome: "Falcão",
                img: "imagesanimaispoder/falcao.jpg",
                desc: "Rápido, determinado e com enorme foco. Quando decide algo, vai até o fim."
            }
        };

        const animal = dadosAnimais[resultado];

        // preenche os dados na página
        if (animal) {
            document.getElementById("tituloAnimal").innerText = animal.nome;
            document.getElementById("imgAnimal").src = animal.img;
            document.getElementById("descricaoAnimal").innerText = animal.desc;
        }
    </script>
</body>
</html>
